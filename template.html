  // under the moving marker. A tap jumps the scrubber to that fix.

  // Ontario and the coast; full size once there is room around them.
  function nightRadius() { return map.getZoom() < 6 ? 3.5 : 4.5; }

  TRIP.nights.forEach(function (spot) {
    const dot = L.circleMarker([spot.lat, spot.lon], {
      pane: 'nights', renderer: nightRenderer, className: 'night',
      radius: nightRadius(), weight: 2, opacity: 1, fillOpacity: 1
    });

      ? 'Night of ' + spot.from_label

  map.on('zoomend', function () {

    if (r === nightR) return;

  });

  // How far the marker is from fix current towards the next, 0 to 1. Only

  let shownIndex = -1;
  let shownDay = -1;

  // follow a finger or the playback and must not trail behind it.

  function setIndex(i, source, frac) {
    i = Math.max(0, Math.min(LAST, Math.round(Number(i) || 0)));
    frac = i < LAST && frac > 0 ? Math.min(frac, 1) : 0;

      // up over the dimmed days still ahead where they share a road. A

        styleDays();

    // one. The slider is the exception: its thumb is the finger's.
    if (i !== shownIndex || source === 'slider') {
      shownIndex = i;

    // nudge that fit by the difference between the two paddings. The pan

    // restarted every frame never catches the marker. A pick puts the
    // marker on its day while the map flies to fit that day, and a pan
    // would cut the fly short.
    if (source !== 'init' && source !== 'select') map.panInside(at, panPadding());
    if (source !== 'init' && source !== 'play') haloSoon();
  }

  // Playback runs the whole trip in a minute at a steady speed along the
  // road, one frame at a time, so a long day takes longer than a short
  // one. Gaps over 6 hours, where the device was off, are crossed at once
  // rather than drawn as a slow straight line, and so are fixes taken
  // standing still. The loop only runs while playing.
  const PLAY_MS = 60000;
  const KM_PER_MS = totals.km / PLAY_MS;
  const GAP_S = 6 * 3600;
  let playing = false;
  let playFrame = 0;
  let playClock = null;
  // Where the playhead really is. With less motion the marker shows the

  // covered, or it would start each frame over from the fix and never
  // reach the next.
  let playI = 0;

    let f = playF;
    let km = dt * KM_PER_MS;

      const a = points[i];
      const b = points[i + 1];
      const len = b[4] - a[4];
      if (b[3] - a[3] > GAP_S || len <= 0) { i += 1; f = 0; continue; }

      if (km < left) { f += km / len; km = 0; } else { km -= left; i += 1; f = 0; }

    playF = f;

    // order again. With a day picked the stacking is left alone, so the
    // picked day stays above the faded ones.
    if (selectedDay === null) {
      if (on) raiseDays(0, shownDay); else raiseDays(shownDay + 1, TRIP.days.length - 1);

    if (on) trackEl.classList.remove('pulse'); else restHalo();

    if (playFrame) { cancelAnimationFrame(playFrame); playFrame = 0; }
    if (playing) setPlaying(false);
  }
  function startPlay() {
    if (playing) return;

    if (current >= LAST) setIndex(0, 'play');

    playF = currentFrac;
    playClock = null;

    playFrame = requestAnimationFrame(playStep);

  slider.addEventListener('input', function () { setIndex(nearestIndex(Number(slider.value)), 'slider'); });
  slider.addEventListener('pointerdown', function () { motion('slide', true); });

    const step = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];

  // The chart viewBox is in CSS pixels so stroke widths and the 10px
  // labels stay the same size at every dock width. No right padding: the
  // grid ends where the slider ends, on the dock's own gutter.
  const PAD = { left: 36, top: 8, bottom: 18 };
  // The slider thumb's width; its centre travels half of it in from each end.
  const THUMB_PX = 22;
  const Y_STEPS = [100, 200, 250, 500, 1000];
  // GPS noise at lake level puts the floor a few metres below sea level.
  const SEA_NOISE_M = 20;
  // Labels like "12,000 km" need about 70px each, so a narrow dock on a
  // small phone takes every other tick.
  function xStepKm(plotW) { return plotW < 380 ? 4000 : 2000; }

  let eleMin = Infinity;
  let eleMax = -Infinity;
  points.forEach(function (p) {
    if (p[2] < eleMin) eleMin = p[2];
    if (p[2] > eleMax) eleMax = p[2];
  });
  // In em, so the reserved width follows the readout's size between the
  // phone and desktop layouts.
  readEle.textContent = fmtInt(eleMax) + ' m';
  readEle.style.minWidth = (readEle.getBoundingClientRect().width /
    (parseFloat(getComputedStyle(readEle).fontSize) || 12)).toFixed(3) + 'em';
  // The domain rounds out to the first step that gives at least 3 ticks
  // and no more than the plot has height for: 10px labels need about 18px
  // each, so a short phone chart gets 0, 1,000 and 2,000 m where the
  // desktop gets every 500. A floor within the noise band below sea level
  // snaps to 0 instead of to a tick a whole step further down.
  function yDomain(plotH) {
    const most = Math.max(2, Math.floor(plotH / 18));
    let fit = null;
    for (let s = 0; s < Y_STEPS.length; s++) {
      const step = Y_STEPS[s];
      let lo = Math.floor(eleMin / step) * step;
      if (lo < 0 && eleMin > -SEA_NOISE_M) lo = 0;
      const hi = Math.ceil(eleMax / step) * step;
      fit = { lo: lo, hi: hi, step: step };
      const spans = (hi - lo) / step;
      if (spans >= 2 && spans <= most) break;
    }
    return fit;
  }

  let scale = null;
  let cursorGroup = null;
  let cursorDot = null;
  // Where the cursor was last put, as numbers: the transform read back
  // from the style comes normalised ("67px, 0px") and never matches.
  let cursorX = null;
  let cursorY = null;
  let cursorTimer = 0;
  let dayGroups = [];
  let pressed = false;
  // The day lines and areas sit in one group drawn in km along x, so a
  // zoom is one transform on it rather than every path redrawn.
  let zoomG = null;
  let tickG = null;
  let cursorZoom = null;

  // The chart repeats the map: faded behind a picked day, dimmed ahead of
  // the playing marker. A style, not the attribute, so it eases.
  function fadeChart() {
    dayGroups.forEach(function (g, d) {
      const look = dayLooks[d];
      g.style.opacity = look === 'faded' ? '0.3' : look === 'ahead' ? String(AHEAD_OPACITY) : '1';
    });
  }

  // The cursor moves by transform, the line and the dot drawn at zero, so
  // a jump can ease with a transition and a scrub can skip it.
  function moveCursor(i, ease) {
    if (!scale) return;
    if (cursorZoom) { cursorZoom.cancel(); cursorZoom = null; }
    const cx = Number(scale.x(points[i][4]).toFixed(1));
    const cy = Number(scale.y(points[i][2]).toFixed(1));
    const out = cx < scale.left - 0.5 || cx > scale.W + 0.5;
    if (out !== cursorGroup.classList.contains('out')) {
      cursorGroup.classList.toggle('out', out);
      ease = false;
    }
    // Only a move that really goes somewhere starts a transition, and so
    // only that one will end with a transitionend. The timer is for a
    // transition that ends neither way, so the glass cannot stay at rest.
    const easing = !!ease && !reduceMotion && cursorX !== null && (cx !== cursorX || cy !== cursorY);
    cursorGroup.classList.toggle('ease', easing);
    if (easing) {
      motion('cursor', true);
      if (cursorTimer) clearTimeout(cursorTimer);
      cursorTimer = setTimeout(function () { cursorTimer = 0; motion('cursor', false); }, 260);
    }
    cursorX = cx;
    cursorY = cy;
    cursorGroup.style.transform = 'translate(' + cx + 'px, 0)';
    cursorDot.style.transform = 'translate(0, ' + cy + 'px)';
    cursorDot.setAttribute('fill', TRIP.days[points[i][5]].color);
  }

  // cum_km never decreases, so the nearest point by distance is found by
  // bisection rather than a scan over all the points on every pointer move.
  function nearestIndex(km) {
    let lo = 0;
    let hi = LAST;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (points[mid][4] < km) lo = mid + 1; else hi = mid;
    }
    if (lo > 0 && km - points[lo - 1][4] < points[lo][4] - km) lo -= 1;
    return lo;
  }

  // The fixes each day covers on the chart: its own, the one its last
  // line runs into, and up to the fix where it got to the spot it slept
  // at, which in BC is after midnight Toronto time, so the whole drive
  // shows. nightFix is that fix: the spot's own for the night a stay
  // began, and for a later night of a longer stay the day's last fix at
  // the spot, not the stay's first evening.
  const dayLo = [];
  const dayHi = [];
  const nightFix = [];
  TRIP.days.forEach(function (day, d) {
    let lo = LAST;
    let hi = 0;
    day.segments.forEach(function (seg) { lo = Math.min(lo, seg[0]); hi = Math.max(hi, seg[1]); });
    const spot = day.night === null || day.night === undefined ? null : TRIP.nights[day.night];
    let fix = null;
    const later = d > 0 && spot !== null && TRIP.days[d - 1].night === day.night;
    if (spot && !later) {
      fix = spot.idx;
    } else if (spot) {
      const at = L.latLng(spot.lat, spot.lon);
      for (let i = hi; i >= lo && fix === null; i--) {
        if (points[i][5] === d && at.distanceTo(latlngs[i]) <= 300) fix = i;
      }
      for (let i = hi; i <= LAST && points[i][5] <= d + 1 && fix === null; i++) {
        if (at.distanceTo(latlngs[i]) <= 300) fix = i;
      }
      if (fix === null) fix = spot.idx;
    }
    if (fix !== null && fix > hi && points[fix][5] <= d + 1) hi = fix;
    dayLo.push(lo);
    dayHi.push(hi);
    nightFix.push(fix);
  });
  // The x domain is a start and a width rather than two ends, since the
  // zoom eases the width evenly in scale (lerpDom) and the transform that
  // shows it is one scale and one offset.
  function fullDom() { return { a: 0, w: totals.km }; }
  function isFull(dom) { return dom.a < 0.001 && Math.abs(dom.w - totals.km) < 0.001; }
  // A day with a little of the days either side, so it does not touch the
  // edges and the faded neighbours say where it sits in the trip.
  function dayDom(d) {
    const a = points[dayLo[d]][4];
    const span = Math.max(1, points[dayHi[d]][4] - a);
    const w = Math.min(totals.km, span * 1.08);
    const start = Math.max(0, Math.min(totals.km - w, a - span * 0.04));
    return { a: start, w: w };
  }
  let xDom = fullDom();

  function indexAtClientX(clientX) {
    const r = chart.getBoundingClientRect();
    const frac = Math.max(0, Math.min(1, (clientX - r.left - scale.left) / scale.plotW));
    const i = nearestIndex(xDom.a + frac * xDom.w);
    // Zoomed to a day, the scrub stays on that day's drive.
    if (selectedDay === null) return i;
    return Math.max(dayLo[selectedDay], Math.min(dayHi[selectedDay], i));
  }

  // One transform on the group of lines for the whole range, so a zoom
  // frame never rebuilds the paths.
  function zoomTransform(dom) {
    const sx = scale.plotW / dom.w;
    return 'translate(' + (scale.left - sx * dom.a).toFixed(3) + 'px, 0px) scale(' + sx.toFixed(6) + ', 1)';
  }
  function xAt(km, dom) { return scale.left + scale.plotW * (km - dom.a) / dom.w; }

  // Ticks on round steps for the range shown. The whole trip keeps its
  // 2,000 km steps (4,000 on a narrow dock); a day takes the smallest of
  // 1, 2 or 5 times a power of ten that leaves room for its labels. The
  // group goes into the chart before its labels are measured: text that is
  // not in the document measures 0 wide. It is added before next.
  const NF_KM = new Intl.NumberFormat('en-CA', { maximumFractionDigits: 1 });
  function drawTicks(dom, parent, next) {
    const full = isFull(dom);
    let step;
    if (full) {
      step = xStepKm(scale.plotW);
    } else {
      // One spacing at every width, about the whole trip's at its
      // narrowest, so the axis keeps its density when a day is picked;
      // the widest label, "12,450 km", still has clear space either side.
      const room = 64;
      const raw = dom.w * room / scale.plotW;
      const mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
      step = [1, 2, 5, 10].map(function (m) { return m * mag; }).filter(function (s) { return s >= raw; })[0];
    }
    const kms = [];
    for (let km = full ? 0 : Math.ceil(dom.a / step) * step; km <= dom.a + dom.w + 1e-6; km += step) {
      kms.push(Math.round(km * 10) / 10);
    }
    const g = svgEl('g', { class: 'grid xticks' });
    parent.insertBefore(g, next || null);
    kms.forEach(function (km, k) {
      const gx = Math.round(xAt(km, dom)) + 0.5;
      const t = svgEl('g', {});
      t.style.transform = 'translate(' + gx + 'px, 0px)';
      t.setAttribute('data-km', String(km));
      t.appendChild(svgEl('line', { class: 'tick', x1: 0, x2: 0, y1: scale.bottom, y2: scale.bottom + 3 }));
      g.appendChild(t);
      // The origin keeps its tick but not a label: the 0 m beside it
      // already marks the corner, and two zeros there read as one blur.
      if (km === 0) return;
      const label = svgEl('text', { x: 0, y: scale.H - 5, 'text-anchor': 'middle' });
      label.textContent = NF_KM.format(km) + (k === kms.length - 1 ? ' km' : '');
      t.appendChild(label);
      // A zoomed day's first step can land on the plot's left edge, where
      // its label would run into the elevation labels; it keeps its tick.
      const half = label.getComputedTextLength() / 2;
      if (gx - half < scale.left - 2) {
        t.removeChild(label);
        return;
      }
      // The last label carries the unit and sits near the right edge, so
      // it is pulled in to end at the edge rather than run past it.
      if (gx + half > scale.W) {
        label.setAttribute('x', String(scale.W - gx));
        label.setAttribute('text-anchor', 'end');
      }
    });
    return g;
  }

  // Picking a day zooms the chart to it and clearing it zooms back out,
  // over 400ms. The zoom is even in scale, the way a map zooms, about the
  // one point that stays put between the two ranges, so the day grows out
  // of where it sat. It runs as keyframes worked out here once, with the
  // same easing as the rest of the page, so no script runs per frame; the
  // old ticks ride out with the zoom and fade, the new ones ride in.
  const ZOOM_MS = 400;
  let zoomAnims = [];
  let leavingTicks = [];
  function stopZoom() {
    zoomAnims.forEach(function (a) { a.cancel(); });
    zoomAnims = [];
    if (cursorZoom) { cursorZoom.cancel(); cursorZoom = null; }
    leavingTicks.forEach(function (g) { if (g.parentNode) g.parentNode.removeChild(g); });
    leavingTicks = [];
    motion('zoom', false);
  }
  // Where the zoom is now, read back from the running transform, so a new
  // pick mid zoom starts from what is on screen.
  function shownDom() {
    if (!zoomAnims.length || !zoomG) return xDom;
    const m = new DOMMatrix(getComputedStyle(zoomG).transform);
    if (!(m.a > 0)) return xDom;
    return { a: (scale.left - m.e) / m.a, w: scale.plotW / m.a };
  }
  function lerpDom(from, to, p) {
    const r = to.w / from.w;
    if (Math.abs(Math.log(r)) < 0.01) {
      return { a: from.a + (to.a - from.a) * p, w: from.w + (to.w - from.w) * p };
    }
    const w = from.w * Math.pow(r, p);
    const fixed = (from.a * to.w - to.a * from.w) / (to.w - from.w);
    return { a: fixed - (fixed - from.a) * w / from.w, w: w };
  }
  function zoomChart(to) {
    const from = scale && zoomG ? shownDom() : xDom;
    xDom = to;
    if (!scale || !zoomG) return;
    // Ticks still fading in from a zoom cut short fade out from where they
    // got to, not from full strength, or stepping days quickly would flash
    // every half faded label before it goes.
    const shown = zoomAnims.length && tickG
      ? Array.prototype.map.call(tickG.children, function (t) { return Number(getComputedStyle(t).opacity); })
      : null;
    stopZoom();
    // The new state goes on first, so it holds when the keyframes end.
    zoomG.style.transform = zoomTransform(to);
    const old = tickG;
    tickG = drawTicks(to, old.parentNode, old.nextSibling);
    moveCursor(current);
    const same = Math.abs(from.a - to.a) < 0.01 && Math.abs(from.w - to.w) < 0.01;
    if (!canAnimate || same) {
      old.parentNode.removeChild(old);
      return;
    }
    const N = 24;
    const doms = [];
    for (let k = 0; k <= N; k++) doms.push(lerpDom(from, to, k / N));
    const timing = { duration: ZOOM_MS, easing: EASE_UI };
    motion('zoom', true);
    const main = zoomG.animate(doms.map(function (d) { return { transform: zoomTransform(d) }; }), timing);
    zoomAnims.push(main);
    function ride(node, km, fade, fill) {
      zoomAnims.push(node.animate(doms.map(function (d, k) {
        return { transform: 'translate(' + xAt(km, d).toFixed(1) + 'px, 0px)', opacity: fade(k / N) };
      }), Object.assign({ fill: fill }, timing)));
    }
    // The old ticks hold their faded end until they are taken out, so the
    // frame between the end of the zoom and their removal never shows them.
    leavingTicks.push(old);
    Array.prototype.forEach.call(old.children, function (t, k) {
      const o = shown && shown[k] < 1 ? shown[k] : 1;
      ride(t, Number(t.getAttribute('data-km')), function (p) { return o * Math.max(0, 1 - p * 2.5); }, 'forwards');
    });
    Array.prototype.forEach.call(tickG.children, function (t) {
      ride(t, Number(t.getAttribute('data-km')), function (p) { return Math.max(0, Math.min(1, (p - 0.4) / 0.6)); }, 'none');
    });
    const ckm = points[current][4];
    cursorZoom = cursorGroup.animate(doms.map(function (d) {
      return { transform: 'translate(' + xAt(ckm, d).toFixed(1) + 'px, 0px)' };
    }), timing);
    main.finished.then(function () {
      if (zoomAnims[0] !== main) return;
      zoomAnims = [];
      cursorZoom = null;
      leavingTicks.forEach(function (g) { if (g.parentNode) g.parentNode.removeChild(g); });
      leavingTicks = [];
      motion('zoom', false);
    }, function () {});
  }

  function render() {
    // The chart's own width, not the dock's: the dock has side padding.
    const W = Math.round(chart.getBoundingClientRect().width);
    const H = Math.round(chart.getBoundingClientRect().height);
    if (W < 80 || H < 40) return;
    // The hit rect under the pointer is about to go, and with it the
    // pointerleave that would end the scrub.
    motion('scrub', false);
    motion('cursor', false);
    stopZoom();
    while (chart.firstChild) chart.removeChild(chart.firstChild);
    chart.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

    const plotH = H - PAD.top - PAD.bottom;
    const yDom = yDomain(plotH);
    const yTicks = [];
    for (let v = yDom.lo; v <= yDom.hi; v += yDom.step) {
      yTicks.push({ v: v, text: fmtInt(v) + (v === yDom.hi ? ' m' : '') });
    }
    // The left margin grows past 36px only when the labels need it, which
    // the unit on the top label can force with a wide system font.
    let left = PAD.left;
    const probe = svgEl('text', { x: 0, y: 0 });
    chart.appendChild(probe);
    yTicks.forEach(function (t) {
      probe.textContent = t.text;
      left = Math.max(left, Math.ceil(probe.getComputedTextLength()) + 8);
    });
    chart.removeChild(probe);

    // The data runs between the two ends of the slider thumb's travel, half
    // a thumb in from each end of the slider, so the cursor and the thumb
    // sit on one line. The grid still runs to the dock's gutter.
    const cr = chart.getBoundingClientRect();
    const sr = slider.getBoundingClientRect();
    const thumbHalf = THUMB_PX / 2;
    if (sr.width > THUMB_PX) left = Math.max(left, Math.round(sr.left - cr.left + thumbHalf));
    const plotRight = sr.width > THUMB_PX ? Math.round(sr.right - cr.left - thumbHalf) : W;
    const plotW = plotRight - left;
    const x = function (km) { return left + plotW * (km - xDom.a) / xDom.w; };
    const y = function (m) { return PAD.top + plotH * (yDom.hi - m) / (yDom.hi - yDom.lo); };
    const bottom = Math.round(PAD.top + plotH) + 0.5;
    scale = { x: x, y: y, left: left, plotW: plotW, W: W, H: H, bottom: bottom };

    const grid = svgEl('g', { class: 'grid' });
    yTicks.forEach(function (t) {
      // Half pixel offset so the 1px line lands on one row of pixels.
      const gy = Math.round(y(t.v)) + 0.5;
      grid.appendChild(svgEl('line', { x1: left, x2: W, y1: gy, y2: gy }));
      const label = svgEl('text', { x: left - 6, y: gy, dy: '0.35em', 'text-anchor': 'end' });
      label.textContent = t.text;
      grid.appendChild(label);
    });
    chart.appendChild(grid);
    tickG = drawTicks(xDom, chart, null);

    // The area under the line is a flat wash of the day's colour so the
    // profile has some body. A plain fill, not a gradient mask: a mask is
    // composited again on every cursor move, and the cursor moves at 60 Hz.
    const floorY = (PAD.top + plotH).toFixed(1);

    // Zoomed to a day the lines run on past the plot, so they are clipped
    // where the grid starts; the cursor's clip leaves room for its dot at
    // either end of the whole trip.
    const defs = svgEl('defs', {});
    const clipPlot = svgEl('clipPath', { id: 'chart-clip' });
    clipPlot.appendChild(svgEl('rect', { x: left - 1, y: 0, width: W - left + 1, height: H }));
    const clipCursor = svgEl('clipPath', { id: 'cursor-clip' });
    clipCursor.appendChild(svgEl('rect', { x: left - 8, y: 0, width: W - left + 16, height: H }));
    defs.appendChild(clipPlot);
    defs.appendChild(clipCursor);
    chart.appendChild(defs);

    // One subpath per segment, so the chart breaks at the same gaps the
    // map does, and one area and one line path per day. Along x the paths
    // are in km with two decimals, so a short day zoomed to the full width
    // stays smooth; the strokes keep their 2px through the stretch.
    const plotG = svgEl('g', { 'clip-path': 'url(#chart-clip)' });
    const days = svgEl('g', {});
    zoomG = svgEl('g', { class: 'zoom' });
    dayGroups = TRIP.days.map(function (day) {
      const g = svgEl('g', { class: 'day' });
      let line = '';
      let area = '';
      day.segments.forEach(function (seg) {
        if (seg[1] <= seg[0]) return;
        let d = '';
        for (let i = seg[0]; i <= seg[1]; i++) {
          d += (i === seg[0] ? 'M' : 'L') + points[i][4].toFixed(2) + ' ' + y(points[i][2]).toFixed(1);
        }
        line += d;
        area += d + 'L' + points[seg[1]][4].toFixed(2) + ' ' + floorY + 'L' + points[seg[0]][4].toFixed(2) + ' ' + floorY + 'Z';
      });
      if (line) {
        g.appendChild(svgEl('path', { d: area, fill: day.color, 'fill-opacity': 0.14, stroke: 'none' }));
        g.appendChild(svgEl('path', {
          d: line, fill: 'none', stroke: day.color, 'stroke-width': 2,
          'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'vector-effect': 'non-scaling-stroke'
        }));
      }
      zoomG.appendChild(g);
      return g;
    });
    zoomG.style.transform = zoomTransform(xDom);
    days.appendChild(zoomG);
    plotG.appendChild(days);
    chart.appendChild(plotG);

    const cursorClip = svgEl('g', { 'clip-path': 'url(#cursor-clip)' });
    cursorGroup = svgEl('g', { class: 'cursor' });
    cursorX = null;
    cursorY = null;
    ['transitionend', 'transitioncancel'].forEach(function (type) {
      cursorGroup.addEventListener(type, function () { motion('cursor', false); });
    });
    cursorDot = svgEl('circle', { r: 5, cx: 0, cy: 0 });
    cursorGroup.appendChild(svgEl('line', { x1: 0, x2: 0, y1: PAD.top, y2: PAD.top + plotH }));
    cursorGroup.appendChild(cursorDot);
    cursorClip.appendChild(cursorGroup);
    chart.appendChild(cursorClip);
    chartIntro(days, cursorGroup);

    // A transparent rect over the plot takes the pointer so the paths and
    // labels underneath never swallow a move or a tap.
    const hit = svgEl('rect', { x: left, y: PAD.top, width: W - left, height: plotH, fill: 'transparent' });
    hit.addEventListener('pointerdown', function (e) {
      pressed = true;
      if (hit.setPointerCapture) hit.setPointerCapture(e.pointerId);
      setIndex(indexAtClientX(e.clientX), 'chart');
    });
    hit.addEventListener('pointermove', function (e) {
      // A finger only scrubs while it is down; a mouse scrubs on hover.
      if (e.pointerType === 'mouse' || pressed) setIndex(indexAtClientX(e.clientX), 'chart');
    });
    hit.addEventListener('pointerup', function () { pressed = false; });
    hit.addEventListener('pointercancel', function () { pressed = false; });
    // A scrub rewrites the readout and the cursor on every move.
    hit.addEventListener('pointerenter', function () { motion('scrub', true); });
    hit.addEventListener('pointerleave', function () { motion('scrub', false); });
    chart.appendChild(hit);

    fadeChart();
    moveCursor(current);
  }

  // The dock changes width on rotation and when the desktop panel resizes
  // the map; one frame coalesces the bursts a resize produces.
  let renderFrame = 0;
  function scheduleRender() {
    if (renderFrame) return;
    renderFrame = requestAnimationFrame(function () { renderFrame = 0; render(); });
  }
  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(scheduleRender).observe(dock);
  } else {
    window.addEventListener('resize', scheduleRender);
  }

  // Load. The days draw themselves in order, each over a share of the
  // time that matches its distance, so a long day takes longer to draw
  // than a short one, and each eases in and out over its own share. The
  // nights pop in as the line reaches them, End and the marker come last,
  // then the chart draws. A pointerdown, wheel, keydown or zoomstart
  // finishes the route and the chart at once; the panel's entrance is
  // short and plays on.
  const REVEAL_MS = 2600;
  const CHART_MS = 800;
  const POP_MS = 220;
  const POP_EASE = 'cubic-bezier(0.34, 1.4, 0.64, 1)';
  let introStart = null;
  let introAnims = [];
  // The time, as a share of one ease-in-out run, at which it reaches a
  // given share of the distance; found by bisection on the
  // cubic-bezier(0.42, 0, 0.58, 1) that 'ease-in-out' stands for.
  function revealTimeAt(share) {
    const bez = function (t, a, b) { const u = 1 - t; return 3 * u * u * t * a + 3 * u * t * t * b + t * t * t; };
    let lo = 0;
    let hi = 1;
    for (let k = 0; k < 24; k++) {
      const mid = (lo + hi) / 2;
      if (bez(mid, 0, 1) < share) lo = mid; else hi = mid;
    }
    return bez((lo + hi) / 2, 0.42, 0.58);
  }
  // A segment's slice of the reveal: from the share of the trip done when
  // it starts to the share done when it ends.
  function revealSpan(seg) {
    const a = Math.min(1, points[seg[0]][4] / totals.km);
    return [a, Math.min(1, Math.max(a, points[seg[1]][4] / totals.km))];
  }
  // When the pen reaches fix i, as a share of the reveal, on its
  // segment's own ease.
  function revealAt(i) {
    for (let d = 0; d < TRIP.days.length; d++) {
      const segs = TRIP.days[d].segments;
      for (let s = 0; s < segs.length; s++) {
        const seg = segs[s];
        if (i < seg[0] || i > seg[1]) continue;
        const span = revealSpan(seg);
        const len = points[seg[1]][4] - points[seg[0]][4];
        const share = len > 0 ? (points[i][4] - points[seg[0]][4]) / len : 1;
        return span[0] + (span[1] - span[0]) * revealTimeAt(share);
      }
    }
    return Math.min(1, points[i][4] / totals.km);
  }
  function pop(node, delay, ms) {
    return node.animate([
      { opacity: 0, transform: 'scale(0.4)' },
      { opacity: 1, transform: 'scale(1)' }
    ], { duration: ms || POP_MS, delay: delay, easing: POP_EASE, fill: 'backwards' });
  }
  function fadeIn(node, delay, ms) {
    return node.animate([{ opacity: 0 }, { opacity: node.style.opacity || 1 }],
      { duration: ms, delay: delay, easing: EASE_UI, fill: 'backwards' });
  }
  function startReveal() {
    if (!canAnimate) return;
    motion('intro', true);
    introStart = document.timeline ? document.timeline.currentTime : null;
    routeParts.forEach(function (part) {
      const path = part.layer.getElement();
      if (!path) return;
      const span = revealSpan(part.seg);
      const a = span[0];
      const b = span[1];
      // A lone fix, or a short day Leaflet has simplified to one pixel at
      // this zoom: a dash has no length to hide there and the round cap
      // would show as a dot, so it appears when the pen reaches it.
      if (part.dot || path.getTotalLength() < 0.5) {
        introAnims.push(path.animate([
          { opacity: 0, offset: 0 }, { opacity: 0, offset: a },
          { opacity: 1, offset: Math.min(1, a + 0.01) }, { opacity: 1, offset: 1 }
        ], { duration: REVEAL_MS, fill: 'both' }));
        return;
      }
      // A dash as long as the path and a gap twice that, pushed just past
      // the start so not even a round cap shows, then pulled back in.
      // pathLength makes that the same numbers for every path.
      part.dashed = true;
      path.setAttribute('pathLength', '1');
      path.style.strokeDasharray = '1 2';
      // The easing on a keyframe runs to the next one, so it eases this
      // segment's slice only and leaves the times linear in distance.
      introAnims.push(path.animate([
        { strokeDashoffset: 1.01, offset: 0 }, { strokeDashoffset: 1.01, offset: a, easing: 'ease-in-out' },
        { strokeDashoffset: 0, offset: b }, { strokeDashoffset: 0, offset: 1 }
      ], { duration: REVEAL_MS, fill: 'both' }));
    });
    TRIP.nights.forEach(function (spot, k) {
      const node = nightDots[k].getElement();
      if (node) introAnims.push(pop(node, revealAt(spot.idx) * REVEAL_MS));
    });
    const startDot = startMarker.getElement();
    const endDot = finishMarker.getElement();
    const startTip = startMarker.getTooltip().getElement();
    const endTip = finishMarker.getTooltip().getElement();
    if (startDot) introAnims.push(pop(startDot, 0));
    if (startTip) introAnims.push(fadeIn(startTip, 60, 240));
    if (endDot) introAnims.push(pop(endDot, REVEAL_MS));
    if (endTip) introAnims.push(fadeIn(endTip, REVEAL_MS + 40, 280));
    // The halo waits for the dot, or a pulse would ring an empty spot.
    const dotIn = pop(trackDot, REVEAL_MS + 200, 320);
    introAnims.push(dotIn);
    trackEl.classList.add('waiting');
    dotIn.finished.then(function () {
      trackEl.classList.remove('waiting');
      restHalo();
    }, function () {});
    // A wheel, key or touch means the viewer wants the map now.
    ['pointerdown', 'wheel', 'keydown'].forEach(function (type) {
      window.addEventListener(type, finishReveal, { capture: true, passive: true });
    });
    map.on('zoomstart', finishReveal);
  }
  // Called once the chart has added its part, so the clean up waits for
  // the last thing to finish.
  function watchReveal() {
    if (!introAnims.length) return;
    Promise.all(introAnims.map(function (anim) { return anim.finished; })).then(cleanReveal, cleanReveal);
  }
  function finishReveal() {
    introAnims.forEach(function (anim) { anim.finish(); });
  }
  // Leaflet redraws every path on each zoom and pan; the dash and the
  // normalised length come off once the reveal is over so those redraws
  // run on plain paths.
  function cleanReveal() {
    if (!introAnims.length) return;
    introAnims.forEach(function (anim) { anim.cancel(); });
    introAnims = [];
    routeParts.forEach(function (part) {
      const path = part.layer.getElement();
      if (!path || !part.dashed) return;
      part.dashed = false;
      path.removeAttribute('pathLength');
      path.style.strokeDasharray = '';
    });
    ['pointerdown', 'wheel', 'keydown'].forEach(function (type) {
      window.removeEventListener(type, finishReveal, { capture: true, passive: true });
    });
    map.off('zoomstart', finishReveal);
    motion('intro', false);
  }
  // The chart draws left to right once the route is down. render() runs
  // again whenever the dock changes size, so each new set of day paths
  // picks the animation up at the time it has reached.
  // The cursor is the marker's twin, so it comes in with the marker rather
  // than sit alone in the empty chart; opacity only, since its transform
  // carries its position.
  function chartIntro(node, cursor) {
    if (introStart === null || !introAnims.length) return;
    const anim = node.animate([
      { clipPath: 'inset(-4px calc(100% + 4px) -4px -4px)' },
      { clipPath: 'inset(-4px -4px -4px -4px)' }
    ], { duration: CHART_MS, delay: REVEAL_MS, easing: 'cubic-bezier(0.45, 0, 0.25, 1)', fill: 'backwards' });
    anim.startTime = introStart;
    introAnims.push(anim);
    const cur = cursor.animate([{ opacity: 0 }, { opacity: 1 }],
      { duration: 320, delay: REVEAL_MS + 200, easing: EASE_UI, fill: 'backwards' });
    cur.startTime = introStart;
    introAnims.push(cur);
  }

  // The panel's sections rise into place one after another and the totals
  // count up. On a phone the stats are in the closed sheet, so this waits
  // for the first time the sheet opens.
  const STAGGER_MS = 40;
  const COUNT_MS = 1100;
  let panelShown = false;
  function panelIntro() {
    if (panelShown) return;
    panelShown = true;
    if (!canAnimate) return;
    motion('panel', true);
    const phone = getComputedStyle(handle).display !== 'none';
    const daysTable = document.getElementById('days');
    const parts = (phone ? [] : [titleEl]).concat(
      Array.prototype.slice.call(totalsEl.children),
      [document.getElementById('records'), document.getElementById('days-head'), daysTable, document.getElementById('provinces')]
    );
    parts.forEach(function (node, k) {
      node.animate([
        { opacity: 0, transform: 'translateY(8px)' },
        { opacity: 1, transform: 'none' }
      ], { duration: 420, delay: k * STAGGER_MS, easing: EASE_UI, fill: 'backwards' });
    });
    // The distance bars grow out from their figures once the table has
    // risen, a row at a time, the way the route draws itself on the map.
    const barsAt = parts.indexOf(daysTable) * STAGGER_MS + 200;
    trs.forEach(function (tr, r) {
      const bar = kmBars[Number(tr.getAttribute('data-day'))];
      bar.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }],
        { duration: 560, delay: barsAt + r * 16, easing: EASE_UI, fill: 'backwards' });
    });
    countUp();
  }
  function countUp() {
    // Each number is held at its final width first, so the count runs in
    // place, right aligned against the unit.
    counters.forEach(function (c) { c.width = c.node.getBoundingClientRect().width; });
    totalsEl.classList.add('counting');
    counters.forEach(function (c) {
      c.node.style.minWidth = c.width + 'px';
      c.node.textContent = c.fmt(0);
    });
    let t0 = null;
    function frame(t) {
      if (t0 === null) t0 = t;
      const k = Math.min(1, (t - t0) / COUNT_MS);
      const e = 1 - Math.pow(1 - k, 3);
      counters.forEach(function (c) {
        const text = k < 1 ? c.fmt(c.to * e) : c.text;
        if (c.node.textContent !== text) c.node.textContent = text;
      });
      if (k < 1) {
        requestAnimationFrame(frame);
        return;
      }
      counters.forEach(function (c) { c.node.style.minWidth = ''; });
      totalsEl.classList.remove('counting');
      motion('panel', false);
    }
    requestAnimationFrame(frame);
  }

  startReveal();
  render();
  watchReveal();
  setIndex(0, 'init');
  restHalo();
  // Desktop and tablet show the stats from the start. On a phone only the
  // title pill is in view, and it settles in on its own.
  if (getComputedStyle(handle).display === 'none') {
    panelIntro();
  } else if (canAnimate) {
    titleEl.animate([
      { opacity: 0, transform: 'translateY(-6px)' },
      { opacity: 1, transform: 'none' }
    ], { duration: 420, easing: EASE_UI, fill: 'backwards' });
  }
})();
</script>
</body>
</html>
