<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TRIP_TITLE__</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1c1e">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
:root {
  /* The scrollbar and any native control follow color-scheme, not the
     tokens below, so without this they stay light on the dark panel. */
  color-scheme: light dark;
  --bg: #ffffff;
  --panel: #ffffff;
  --panel-glass: rgba(255, 255, 255, 0.88);
  --text: #1b1b1b;
  --muted: #5e5e5e;
  --border: #d8d8d8;
  --row-hover: #f1f1f1;
  --selected-bg: #e6eef9;
  --link: #1b5fa8;
  --grip: #c2c2c2;
  --map-bg: #e9e7e2;
  --marker-stroke: #222222;
  --control-shadow: rgba(0, 0, 0, 0.25);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1e;
    --panel: #1c1c1e;
    --panel-glass: rgba(28, 28, 30, 0.88);
    --text: #ececec;
    --muted: #a3a3a3;
    --border: #3a3a3c;
    --row-hover: #27272a;
    --selected-bg: #2b3a52;
    --link: #8ab8ff;
    --grip: #5a5a5e;
    --map-bg: #1b1d20;
    --marker-stroke: #222222;
    --control-shadow: rgba(0, 0, 0, 0.6);
  }
  /* Inverting the OSM raster gives a dark map without a second tile
     source; the hue rotation puts water back on the blue side. */
  .leaflet-tile-pane {
    filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9) saturate(0.6);
  }
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { height: 100%; }
body {
  /* dvh tracks the mobile browser chrome; vh stays as the fallback for
     browsers that predate it. */
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: grid;
  grid-template-rows: 1fr auto auto auto;
  grid-template-areas: "map" "handle" "dock" "stats";
  padding-bottom: env(safe-area-inset-bottom, 0);
  background: var(--panel);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.4;
  position: relative;
}

#map {
  grid-area: map;
  min-height: 0;
  /* A stacking context of its own keeps Leaflet's pane z-indexes from
     fighting with the title and the sheet handle. */
  position: relative;
  z-index: 0;
  background: var(--map-bg);
}
/* Only shown when Leaflet never arrives from the CDN. Centred in the map
   box so the floating title on a phone does not cover it. */
.map-missing {
  position: absolute;
  top: 50%;
  left: 16px;
  right: 16px;
  transform: translateY(-50%);
  margin: 0;
  color: var(--muted);
  text-align: center;
}

#title {
  position: absolute;
  /* viewport-fit=cover draws under the notch, so the offset grows by the
     inset on phones that report one and stays 10px everywhere else. */
  top: calc(10px + env(safe-area-inset-top, 0px));
  left: calc(10px + env(safe-area-inset-left, 0px));
  max-width: 75%;
  padding: 6px 10px;
  border-radius: 6px;
  background: var(--panel-glass);
  z-index: 1;
  pointer-events: none;
}
#title h1 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.3;
}
#title p {
  margin: 2px 0 0;
  font-size: 13px;
  color: var(--muted);
}

#handle {
  grid-area: handle;
  position: relative;
  z-index: 1;
  width: 100%;
  height: 36px;
  /* Overlapping the map by the corner radius makes the sheet look like
     it sits on top of the map instead of below it. */
  margin-top: -12px;
  padding: 0 12px;
  border: 0;
  border-radius: 12px 12px 0 0;
  background: var(--panel);
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
}
/* Text screen readers need but sighted users do not (the handle name,
   the slider label, the table caption). Clipped to a pixel rather than
   display none so it stays in the accessibility tree. */
.vh {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
#handle .grip {
  display: block;
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: var(--grip);
}
#handle:focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }
/* The handle overlaps the bottom of the map, so the attribution moves up
   by the same amount to stay readable. */
.leaflet-container .leaflet-bottom .leaflet-control-attribution { margin-bottom: 12px; }

#stats {
  grid-area: stats;
  /* The clipped table caption is absolute; without this its containing
     block is body and it pokes out below the closed sheet, making the
     whole page scrollable. */
  position: relative;
  height: 0;
  overflow: hidden;
  /* Height 0 alone leaves the rows focusable behind a handle that says
     collapsed; visibility takes them out of the tab order too. The delay
     lets the height animation finish before the rows disappear. */
  visibility: hidden;
  background: var(--panel);
  transition: height 0.2s ease, visibility 0s linear 0.2s;
}
body.sheet-open #stats {
  /* The handle row (24px) and the dock (132px) are fixed, so a 55vh sheet
     on a landscape phone would leave the map 0 to 13px tall. The cap keeps
     at least 150px of map; vh is the fallback for browsers without dvh. */
  height: min(55vh, calc(100vh - 306px));
  height: min(55vh, calc(100dvh - 306px));
  overflow: auto;
  visibility: visible;
  transition: height 0.2s ease, visibility 0s;
  -webkit-overflow-scrolling: touch;
}
/* Totals. Two columns so the nine numbers fit above the fold of the phone
   sheet; the distance spans both because eight items pair off under it
   and it is the one number people ask about. */
#totals {
  padding: 10px 14px 12px;
  border-bottom: 1px solid var(--border);
}
#totals dl {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 12px;
  margin: 0;
}
#totals .hero { grid-column: 1 / -1; }
#totals dt {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
#totals dd {
  margin: 0;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
#totals .hero dd { font-size: 26px; }
/* The jump buttons look like the other values apart from the dotted line,
   which is the usual sign for "tap this" without adding an icon. */
.jump {
  padding: 0;
  border: 0;
  border-radius: 2px;
  background: none;
  color: inherit;
  font: inherit;
  font-variant-numeric: inherit;
  text-decoration: underline dotted;
  text-decoration-color: var(--muted);
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
  cursor: pointer;
}
.jump:hover { text-decoration-color: var(--link); color: var(--link); }
.jump:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

/* Day table. Separate borders, not collapsed ones, because a collapsed
   border on a sticky header scrolls away with the rows in Chrome. */
#days {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
#days th {
  position: sticky;
  top: 0;
  z-index: 1;
  height: 36px;
  /* 4px, not more: at 320px wide the five headers plus a caret only just
     fit, and the gutters on the first and last cells already give air. */
  padding: 0 4px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  text-align: right;
  /* Not nowrap: an auto table only squeezes a column below its text width
     when the row would overflow, so on a phone whose system font is wider
     than this one "Avg km/h" breaks into two lines rather than pushing the
     panel sideways. */
  white-space: normal;
}
#days th:first-child { text-align: left; padding-left: 14px; }
#days th:last-child { padding-right: 14px; }
#days th button {
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  line-height: 1.2;
  text-align: inherit;
  cursor: pointer;
  /* The whole header cell is the target, since 12px text alone is a thin
     thing to hit with a thumb. */
  display: inline-flex;
  align-items: center;
  justify-content: inherit;
  min-height: 36px;
}
#days th button:focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }
#days th .caret {
  display: none;
  width: 8px;
  height: 8px;
  margin-left: 2px;
  vertical-align: middle;
  fill: currentColor;
}
#days th[aria-sort] { color: var(--text); }
#days th[aria-sort] .caret { display: inline-block; }
#days td {
  height: 36px;
  padding: 0 4px;
  border-bottom: 1px solid var(--border);
  text-align: right;
  white-space: nowrap;
}
#days td:last-child { padding-right: 14px; }
#days td:first-child { padding: 0; text-align: left; }
#days tbody tr { cursor: pointer; }
#days tbody tr:hover td { background: var(--row-hover); }
#days tbody tr.selected td { background: var(--selected-bg); }
#days tbody tr.selected { font-weight: 600; }
.day-row {
  width: 100%;
  height: 36px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 0 0 14px;
  border: 0;
  background: none;
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.day-row:focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }
.day-row .swatch {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
  flex: none;
}

/* The gap list and the note use the same muted 13px type as footnotes
   to the table; the note gets its own padding because it is a direct
   child of #stats, not part of #gaps. */
#gaps {
  padding: 4px 14px 0;
}
#stats h2 {
  margin: 0;
  padding: 12px 0 4px;
  font-size: 13px;
  font-weight: 600;
}
#gaps ul {
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
#gaps li { padding: 3px 0; }
#gaps p, #note {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
}
#gaps p { padding: 6px 0 0; }
#note { padding: 14px 14px 18px; }

#dock {
  grid-area: dock;
  position: relative;
  z-index: 1;
  background: var(--panel);
  min-width: 0;
}
#chart {
  display: block;
  width: 100%;
  height: 88px;
  /* The chart is the touch scrubber on phones, so the page must not take
     a drag on it as a scroll. */
  touch-action: none;
  cursor: crosshair;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
  overflow: visible;
}
#chart text { fill: var(--muted); font-family: inherit; }
#chart .grid line { stroke: var(--border); stroke-width: 1; }
#chart .cursor line { stroke: var(--muted); stroke-width: 1; }
#chart .cursor circle { stroke: var(--panel); stroke-width: 1.5; }
#chart .day { transition: opacity 0.15s ease; }
#scrubber {
  height: 44px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px 0 0;
}
#play {
  flex: none;
  width: 36px;
  height: 36px;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--text);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
#play:hover { background: var(--row-hover); }
#play:focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }
#play svg { width: 14px; height: 14px; fill: currentColor; }
#play .icon-pause { display: none; }
#play.playing .icon-play { display: none; }
#play.playing .icon-pause { display: block; }
#scrub {
  flex: 1;
  min-width: 40px;
  margin: 0;
  accent-color: var(--link);
}
#scrub:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
#readout {
  flex: none;
  display: flex;
  gap: 8px;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: var(--muted);
}
#readout .when { color: var(--text); font-weight: 600; }
/* Fixed widths so the slider does not shift as the numbers change length. */
#readout .ele { min-width: 6.5ch; text-align: right; }
#readout .km { min-width: 8.5ch; text-align: right; }

@media (max-width: 767px) {
  /* With the sheet open the map is about a quarter of the screen and the
     title panel would cover a third of that, including the day the user
     just tapped. The handle repeats the subtitle, so nothing is lost. */
  body.sheet-open #title { display: none; }
}

@media (min-width: 768px) {
  body {
    grid-template-columns: 380px 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas: "title map" "stats map" "stats dock";
    padding-bottom: 0;
  }
  #title {
    grid-area: title;
    position: static;
    max-width: none;
    padding: 14px 16px;
    border-radius: 0;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    pointer-events: auto;
  }
  #title h1 { font-size: 18px; }
  #title p { font-size: 14px; }
  #handle { display: none; }
  .leaflet-container .leaflet-bottom .leaflet-control-attribution { margin-bottom: 0; }
  #stats, body.sheet-open #stats {
    height: auto;
    min-height: 0;
    overflow: auto;
    visibility: visible;
    border-right: 1px solid var(--border);
    transition: none;
  }
  #totals { padding-top: 14px; }
  #dock { border-top: 1px solid var(--border); }
  #chart { height: 120px; }
  #scrubber { padding-right: 16px; gap: 12px; }
  #readout { font-size: 13px; gap: 12px; }
}

/* Leaflet controls in the page's own colours so they read in both themes. */
.leaflet-container {
  background: var(--map-bg);
  font-family: inherit;
}
/* Same inset rule as #title, so the zoom control and attribution stay
   clear of the sensor housing in landscape. */
.leaflet-top .leaflet-control { margin-top: calc(10px + env(safe-area-inset-top, 0px)); }
.leaflet-right .leaflet-control { margin-right: calc(10px + env(safe-area-inset-right, 0px)); }
.leaflet-bar {
  box-shadow: 0 1px 4px var(--control-shadow);
}
.leaflet-touch .leaflet-bar {
  border-color: var(--border);
}
.leaflet-bar a,
.leaflet-bar a:hover,
.leaflet-bar a:focus {
  background: var(--panel);
  color: var(--text);
  border-bottom-color: var(--border);
}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
  background: var(--row-hover);
}
.leaflet-bar a.leaflet-disabled {
  background: var(--panel);
  color: var(--border);
}
.leaflet-container .leaflet-control-attribution {
  background: var(--panel-glass);
  color: var(--muted);
  font-size: 11px;
}
.leaflet-container .leaflet-control-attribution a {
  color: var(--link);
}
.leaflet-tooltip {
  background: var(--panel);
  border-color: var(--border);
  color: var(--text);
  font-weight: 600;
  font-size: 12px;
  padding: 2px 7px;
  box-shadow: 0 1px 3px var(--control-shadow);
}
.leaflet-tooltip-top:before { border-top-color: var(--panel); }
.leaflet-tooltip-bottom:before { border-bottom-color: var(--panel); }
.leaflet-tooltip-left:before { border-left-color: var(--panel); }
.leaflet-tooltip-right:before { border-right-color: var(--panel); }
</style>
</head>
<body>
<header id="title">
  <h1>__TRIP_TITLE__</h1>
  <p>__TRIP_SUBTITLE__</p>
</header>
<div id="map"></div>
<button id="handle" type="button" aria-expanded="false" aria-controls="stats">
  <span class="grip" aria-hidden="true"></span>
  <span class="vh">Trip stats, </span>
  <span class="handle-text">__TRIP_SUBTITLE__</span>
</button>
<div id="dock">
  <svg id="chart" role="img" aria-label="Elevation along the trip"></svg>
  <div id="scrubber">
    <button id="play" type="button" aria-label="Play">
      <svg viewBox="0 0 14 14" aria-hidden="true" focusable="false">
        <path class="icon-play" d="M3 1.5v11l9.5-5.5z"></path>
        <g class="icon-pause"><rect x="2.5" y="1.5" width="3.5" height="11"></rect><rect x="8" y="1.5" width="3.5" height="11"></rect></g>
      </svg>
    </button>
    <label for="scrub" class="vh">Position along the trip</label>
    <input id="scrub" type="range" min="0" max="0" step="1" value="0">
    <output id="readout" for="scrub" aria-live="off">
      <span id="readout-when" class="when"></span>
      <span id="readout-ele" class="ele"></span>
      <span id="readout-km" class="km"></span>
    </output>
  </div>
</div>
<aside id="stats" aria-label="Trip stats">
  <section id="totals" aria-label="Trip totals"></section>
  <table id="days">
    <caption class="vh">Days</caption>
    <thead>
      <tr>
        <th scope="col"><button type="button" data-sort="date">Day</button></th>
        <th scope="col"><button type="button" data-sort="km">km</button></th>
        <th scope="col"><button type="button" data-sort="moving_h">Moving h</button></th>
        <th scope="col"><button type="button" data-sort="gain_m">Gain m</button></th>
        <th scope="col"><button type="button" data-sort="avg_kmh">Avg km/h</button></th>
      </tr>
    </thead>
    <tbody id="day-rows"></tbody>
  </table>
  <section id="gaps">
    <h2 id="gaps-heading"></h2>
    <ul id="gap-list" aria-labelledby="gaps-heading"></ul>
    <p id="gaps-note"></p>
  </section>
  <p id="note"></p>
</aside>
<script id="trip-data" type="application/json">__TRIP_DATA__</script>
<script>
(function () {
  'use strict';

  const TRIP = JSON.parse(document.getElementById('trip-data').textContent);

  // Leaflet comes from a CDN. Without it the page would be a blank map
  // box and dead controls, so it says what happened instead.
  if (typeof L === 'undefined') {
    const missing = document.createElement('p');
    missing.className = 'map-missing';
    missing.textContent = 'The map did not load. It needs Leaflet from cdnjs.cloudflare.com and this connection did not reach it.';
    document.getElementById('map').appendChild(missing);
    return;
  }

  // Times are shown in the trip's home zone, not the viewer's, so the
  // page agrees with the day grouping build.py already did.
  const fmtTime = new Intl.DateTimeFormat('en-CA', {
    timeZone: TRIP.meta.tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
  });

  const LINE_WEIGHT = 3;
  const SELECTED_WEIGHT = 5;
  const LINE_OPACITY = 0.9;
  const FADED_OPACITY = 0.25;
  // Room so the fitted track clears the zoom control, and on phones the
  // title panel floating over the map. The title box is read at call
  // time because the sheet changes the map height and the title can wrap.
  const FIT_PAD = 36;
  const titleEl = document.getElementById('title');
  function fitPadding() {
    const mapH = map.getSize().y;
    // Leaflet subtracts the padding from the map size before it picks a
    // zoom, and a negative size comes out as zoom 19. The open sheet is
    // capped so the map keeps about 150px, but a viewport shorter than
    // that still exists, so any map too short for the padding gets none.
    if (mapH < 2 * FIT_PAD + 40) return { padding: [0, 0] };
    let top = FIT_PAD;
    if (getComputedStyle(titleEl).position === 'absolute') {
      // The title is hidden while the sheet is open, so its height is 0
      // then and the floor keeps the fit clear of the zoom control.
      top = Math.max(FIT_PAD, titleEl.offsetTop + titleEl.offsetHeight + 16);
    }
    // When the title would eat more than half of a short map there is no
    // room to fit under it, so the flat value wins and the overlap stays.
    if (top + FIT_PAD > mapH / 2) top = FIT_PAD;
    return { paddingTopLeft: [FIT_PAD, top], paddingBottomRight: [FIT_PAD, FIT_PAD] };
  }

  const latlngs = TRIP.points.map(function (p) { return [p[0], p[1]]; });
  const trackBounds = L.latLngBounds(latlngs);

  const map = L.map('map', { zoomControl: false });
  // The default prefix carries an inline flag icon from the library; the
  // credit stays, as text.
  map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  map.fitBounds(trackBounds, fitPadding());

  // A segment with a single point is a lone fix between two gaps, so it
  // gets a dot rather than a zero length line.
  const dayLayers = [];
  const dayBounds = [];
  TRIP.days.forEach(function (day, d) {
    const group = L.layerGroup();
    const dayCoords = [];
    day.segments.forEach(function (seg) {
      const coords = latlngs.slice(seg[0], seg[1] + 1);
      let layer;
      if (coords.length === 1) {
        layer = L.circleMarker(coords[0], {
          radius: 3, color: day.color, fillColor: day.color,
          weight: 1, opacity: LINE_OPACITY, fillOpacity: LINE_OPACITY
        });
      } else {
        layer = L.polyline(coords, {
          color: day.color, weight: LINE_WEIGHT, opacity: LINE_OPACITY,
          lineJoin: 'round', lineCap: 'round'
        });
      }
      layer.on('click', function () { selectDay(d); });
      group.addLayer(layer);
      dayCoords.push.apply(dayCoords, coords);
    });
    group.addTo(map);
    dayLayers.push(group);
    dayBounds.push(L.latLngBounds(dayCoords));
  });

  // Start and end are a few kilometres apart (totals.start_end_km), so at
  // trip zoom the two markers share a pixel. Labels on opposite sides keep
  // both readable instead of one covering the other.
  function endMarker(latlng, text, side) {
    return L.circleMarker(latlng, {
      radius: 6, color: '#222222', weight: 2, opacity: 1,
      fillColor: '#ffffff', fillOpacity: 1
    }).bindTooltip(text, { permanent: true, direction: side, offset: [side === 'left' ? -8 : 8, 0] }).addTo(map);
  }
  const startMarker = endMarker(latlngs[0], 'Start', 'left');
  const finishMarker = endMarker(latlngs[latlngs.length - 1], 'End', 'right');

  // Stats panel. Every number comes from the embedded JSON so the page can
  // never drift from what build.py computed and printed.
  const totals = TRIP.totals;
  function fmtInt(n) { return n.toLocaleString('en-CA', { maximumFractionDigits: 0 }); }
  function fmt1(n) { return n.toLocaleString('en-CA', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
  function el(name, className, text) {
    const n = document.createElement(name);
    if (className) n.className = className;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  // Highest, lowest and farthest are places, so their values double as
  // buttons that put the scrubber marker there.
  const totalItems = [
    { label: 'Distance', value: fmtInt(totals.km) + ' km', hero: true },
    { label: 'Days', value: fmtInt(totals.days) },
    { label: 'Moving', value: fmtInt(totals.moving_h) + ' h' },
    { label: 'Climbed', value: fmtInt(totals.gain_m) + ' m' },
    { label: 'Descended', value: fmtInt(totals.loss_m) + ' m' },
    { label: 'Highest', value: fmtInt(totals.high_m) + ' m', index: totals.high_idx },
    { label: 'Lowest', value: fmtInt(totals.low_m) + ' m', index: totals.low_idx },
    { label: 'Farthest from start', value: fmtInt(totals.farthest_km) + ' km', index: totals.farthest_idx },
    { label: 'Longest gap', value: fmt1(totals.longest_gap_h) + ' h' }
  ];
  const totalsList = el('dl');
  totalItems.forEach(function (item) {
    const wrap = el('div', item.hero ? 'hero' : '');
    wrap.appendChild(el('dt', '', item.label));
    const dd = el('dd');
    if (item.index === undefined) {
      dd.textContent = item.value;
    } else {
      const jump = el('button', 'jump', item.value);
      jump.type = 'button';
      jump.setAttribute('data-index', String(item.index));
      jump.addEventListener('click', function () { setIndex(item.index, 'jump'); });
      dd.appendChild(jump);
    }
    wrap.appendChild(dd);
    totalsList.appendChild(wrap);
  });
  document.getElementById('totals').appendChild(totalsList);

  // Day table. The row button carries the accessible name and pressed
  // state; the click is handled once on the tbody so a tap on the numbers
  // selects the day too without firing twice when the button is hit.
  const tbody = document.getElementById('day-rows');
  const trs = [];
  const rows = TRIP.days.map(function (day, d) {
    const tr = el('tr');
    tr.setAttribute('data-day', String(d));
    const btn = el('button', 'day-row');
    btn.type = 'button';
    btn.setAttribute('data-day', String(d));
    btn.setAttribute('aria-pressed', 'false');
    const swatch = el('span', 'swatch');
    swatch.style.background = day.color;
    btn.appendChild(swatch);
    btn.appendChild(el('span', 'day-label', day.label));
    const first = el('td');
    first.appendChild(btn);
    tr.appendChild(first);
    tr.appendChild(el('td', '', fmt1(day.km)));
    tr.appendChild(el('td', '', fmt1(day.moving_h)));
    tr.appendChild(el('td', '', fmtInt(day.gain_m)));
    const avg = el('td', '', day.avg_kmh === null ? '' : fmt1(day.avg_kmh));
    if (day.avg_kmh === null) avg.setAttribute('aria-label', 'no moving time');
    tr.appendChild(avg);
    tbody.appendChild(tr);
    trs.push(tr);
    return btn;
  });
  tbody.addEventListener('click', function (e) {
    const tr = e.target.closest('tr[data-day]');
    if (tr) selectDay(Number(tr.getAttribute('data-day')));
  });

  // Sorting moves the existing rows rather than rebuilding them, so the
  // selection and the buttons' state survive. Ties fall back to date order.
  const headers = Array.prototype.slice.call(document.querySelectorAll('#days th'));
  const CARET_UP = 'M4 1.5 7.5 6.5H.5z';
  const CARET_DOWN = 'M4 6.5 7.5 1.5H.5z';
  headers.forEach(function (th) {
    const caret = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    caret.setAttribute('class', 'caret');
    caret.setAttribute('viewBox', '0 0 8 8');
    caret.setAttribute('aria-hidden', 'true');
    caret.setAttribute('focusable', 'false');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', CARET_UP);
    caret.appendChild(path);
    th.firstElementChild.appendChild(caret);
  });
  let sortKey = null;
  let sortDir = 'ascending';
  function sortValue(d) {
    if (sortKey === 'date') return d;
    const v = TRIP.days[d][sortKey];
    // A day with no moving time has no average; it sorts as the lowest
    // value, so the first, descending, tap keeps the blank cell at the
    // bottom.
    return v === null ? -Infinity : v;
  }
  function sortRows(key) {
    if (key === sortKey) {
      sortDir = sortDir === 'ascending' ? 'descending' : 'ascending';
    } else {
      sortKey = key;
      // Dates read oldest first; for the numbers the big day is the one
      // people look for, so those start at the top.
      sortDir = key === 'date' ? 'ascending' : 'descending';
    }
    const sign = sortDir === 'ascending' ? 1 : -1;
    const order = TRIP.days.map(function (day, d) { return d; });
    order.sort(function (a, b) {
      const va = sortValue(a);
      const vb = sortValue(b);
      if (va === vb) return a - b;
      return va < vb ? -sign : sign;
    });
    order.forEach(function (d) { tbody.appendChild(trs[d]); });
    headers.forEach(function (th) {
      const btn = th.firstElementChild;
      if (btn.getAttribute('data-sort') === sortKey) {
        th.setAttribute('aria-sort', sortDir);
        btn.querySelector('path').setAttribute('d', sortDir === 'ascending' ? CARET_UP : CARET_DOWN);
      } else {
        th.removeAttribute('aria-sort');
      }
    });
  }
  document.querySelector('#days thead').addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-sort]');
    if (btn) sortRows(btn.getAttribute('data-sort'));
  });

  // Gaps. The threshold is the one build.py used, so the heading and the
  // list can never disagree about what counts.
  const gapH = TRIP.meta.thresholds.gap_h;
  document.getElementById('gaps-heading').textContent = 'Gaps over ' + gapH.toLocaleString('en-CA') + ' h';
  const gapList = document.getElementById('gap-list');
  TRIP.gaps.forEach(function (gap) {
    let text = gap.from_label + ' to ' + gap.to_label + ', ' + fmt1(gap.hours) + ' h';
    if (gap.jump_km >= 1) text += ', ' + fmt1(gap.jump_km) + ' km between fixes';
    gapList.appendChild(el('li', '', text));
  });
  document.getElementById('gaps-note').textContent = 'The line breaks there and I do not count that distance.';

  // Note. The fix interval is the median step so the sentence stays true if
  // the device is ever set to a different rate.
  const steps = [];
  for (let i = 1; i < TRIP.points.length; i++) steps.push(TRIP.points[i][3] - TRIP.points[i - 1][3]);
  steps.sort(function (a, b) { return a - b; });
  const medianMin = Math.round(steps[steps.length >> 1] / 60);
  const tzCity = TRIP.meta.tz.split('/').pop().replace(/_/g, ' ');
  document.getElementById('note').textContent =
    'Fixes about every ' + medianMin + ' minutes from an inReach while I drove. ' +
    'Days are ' + tzCity + ' dates the whole way, even in BC. ' +
    'Everything within ' + TRIP.meta.thresholds.trim_home_km.toLocaleString('en-CA') + ' km of home is cut.';

  let selectedDay = null;

  function selectDay(d) {
    // The toggle is the list's own clear control, the same as Escape, so
    // the sheet needs no separate clear button.
    if (d === selectedDay) d = null;
    selectedDay = d;
    dayLayers.forEach(function (group, i) {
      const lit = selectedDay === null || i === selectedDay;
      const opacity = lit ? LINE_OPACITY : FADED_OPACITY;
      group.eachLayer(function (layer) {
        if (layer instanceof L.Polyline) {
          layer.setStyle({ opacity: opacity, weight: i === selectedDay ? SELECTED_WEIGHT : LINE_WEIGHT });
        } else {
          layer.setStyle({ opacity: opacity, fillOpacity: opacity });
        }
        if (i === selectedDay) layer.bringToFront();
      });
    });
    // The markers must stay on top of whichever line was just raised.
    startMarker.bringToFront();
    finishMarker.bringToFront();
    rows.forEach(function (row, i) {
      row.setAttribute('aria-pressed', i === selectedDay ? 'true' : 'false');
      // The tint goes on the row, not the button, so the numbers read as
      // selected along with the label.
      trs[i].classList.toggle('selected', i === selectedDay);
    });
    fadeChart();
    const stats = document.getElementById('stats');
    if (selectedDay !== null && stats.clientHeight > 0) {
      // Not scrollIntoView: the sticky header paints over the scrollport
      // without shrinking it, so a row tucked under the header counts as
      // visible and never moves. The header height comes off the top.
      const row = trs[selectedDay].getBoundingClientRect();
      const box = stats.getBoundingClientRect();
      const head = document.querySelector('#days thead').offsetHeight;
      // Rounded up because scrollTop lands on whole pixels and a half
      // pixel short still clips the row's border.
      if (row.top < box.top + head) {
        stats.scrollTop -= Math.ceil(box.top + head - row.top);
      } else if (row.bottom > box.bottom) {
        stats.scrollTop += Math.ceil(row.bottom - box.bottom);
      }
    }
    map.fitBounds(selectedDay === null ? trackBounds : dayBounds[selectedDay], fitPadding());
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && selectedDay !== null) selectDay(null);
  });

  // Mobile sheet. The handle is display none on desktop so this never fires there.
  const handle = document.getElementById('handle');
  handle.addEventListener('click', function () {
    const open = document.body.classList.toggle('sheet-open');
    handle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  // The map box changes size when the sheet opens or closes; without this
  // Leaflet keeps the old size and leaves grey tiles at the edges.
  const mapEl = document.getElementById('map');
  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(function () { map.invalidateSize(); }).observe(mapEl);
  } else {
    handle.addEventListener('click', function () { setTimeout(function () { map.invalidateSize(); }, 250); });
  }
  // With the dock below it, the map with the sheet open is about a quarter
  // of a phone screen; keeping the old centre would cut off the start and
  // end, so the view is fitted again once the height animation ends.
  document.getElementById('stats').addEventListener('transitionend', function (e) {
    if (e.propertyName !== 'height') return;
    map.invalidateSize();
    map.fitBounds(selectedDay === null ? trackBounds : dayBounds[selectedDay], fitPadding());
  });

  // Scrubber. Every change of position goes through setIndex so the map
  // marker, the slider, the readout and the chart cursor cannot disagree.
  const points = TRIP.points;
  const LAST = points.length - 1;
  const dock = document.getElementById('dock');
  const chart = document.getElementById('chart');
  const slider = document.getElementById('scrub');
  const playBtn = document.getElementById('play');
  const readWhen = document.getElementById('readout-when');
  const readEle = document.getElementById('readout-ele');
  const readKm = document.getElementById('readout-km');
  slider.max = String(LAST);

  // A pane of its own keeps the marker above the day lines and the start
  // and end dots, which all share the overlay pane, and below the tooltips.
  map.createPane('track').style.zIndex = '450';
  const trackMarker = L.circleMarker(latlngs[0], {
    pane: 'track', radius: 7, color: '#ffffff', weight: 2, opacity: 1,
    fillColor: TRIP.days[points[0][5]].color, fillOpacity: 1
  }).addTo(map);

  let current = 0;

  function setIndex(i, source) {
    i = Math.max(0, Math.min(LAST, Math.round(Number(i) || 0)));
    current = i;
    const p = points[i];
    const day = TRIP.days[p[5]];
    trackMarker.setLatLng(latlngs[i]);
    trackMarker.setStyle({ fillColor: day.color });
    readWhen.textContent = day.label + ', ' + fmtTime.format(new Date(p[3] * 1000));
    readEle.textContent = Math.round(p[2]).toLocaleString('en-CA') + ' m';
    readKm.textContent = Math.round(p[4]).toLocaleString('en-CA') + ' km';
    if (source !== 'slider') slider.value = String(i);
    moveCursor(i);
    // On load the map was just fitted to the whole track; a pan here would
    // nudge that fit by the difference between the two paddings. The pan
    // is not animated because a 250ms animation restarted every 30ms tick
    // never catches the marker, which then runs off the map while playing.
    if (source !== 'init') map.panInside(latlngs[i], { padding: [48, 48], animate: false });
  }

  let timer = null;
  function setPlaying(on) {
    playBtn.classList.toggle('playing', on);
    playBtn.setAttribute('aria-label', on ? 'Pause' : 'Play');
  }
  function stopPlay() {
    if (timer !== null) { clearInterval(timer); timer = null; }
    setPlaying(false);
  }
  function startPlay() {
    if (timer !== null) return;
    // Play at the end starts over; otherwise the button would do nothing.
    if (current >= LAST) setIndex(0, 'play');
    timer = setInterval(function () {
      setIndex(current + 1, 'play');
      if (current >= LAST) stopPlay();
    }, 30);
    setPlaying(true);
  }
  playBtn.addEventListener('click', function () {
    if (timer === null) startPlay(); else stopPlay();
  });
  slider.addEventListener('input', function () { setIndex(Number(slider.value), 'slider'); });

  // The chart viewBox is in CSS pixels so stroke widths and the 10px
  // labels stay the same size at every dock width.
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const PAD = { left: 36, right: 10, top: 8, bottom: 18 };
  const Y_STEPS = [100, 200, 250, 500, 1000];
  // GPS noise at lake level puts the floor a few metres below sea level.
  const SEA_NOISE_M = 20;
  const X_STEP_KM = 2000;

  function svgEl(name, attrs) {
    const n = document.createElementNS(SVG_NS, name);
    Object.keys(attrs).forEach(function (k) { n.setAttribute(k, String(attrs[k])); });
    return n;
  }

  let eleMin = Infinity;
  let eleMax = -Infinity;
  points.forEach(function (p) {
    if (p[2] < eleMin) eleMin = p[2];
    if (p[2] > eleMax) eleMax = p[2];
  });
  // The domain rounds out to the first step that gives 3 to 5 ticks. A
  // floor within the noise band below sea level snaps to 0 instead of to
  // a tick a whole step further down, whatever the step.
  function yDomain() {
    let fit = null;
    for (let s = 0; s < Y_STEPS.length; s++) {
      const step = Y_STEPS[s];
      let lo = Math.floor(eleMin / step) * step;
      if (lo < 0 && eleMin > -SEA_NOISE_M) lo = 0;
      const hi = Math.ceil(eleMax / step) * step;
      fit = { lo: lo, hi: hi, step: step };
      const n = (hi - lo) / step + 1;
      if (n >= 3 && n <= 5) break;
    }
    return fit;
  }
  const yDom = yDomain();

  let scale = null;
  let cursorLine = null;
  let cursorDot = null;
  let dayGroups = [];
  let pressed = false;

  function fadeChart() {
    dayGroups.forEach(function (g, d) {
      g.setAttribute('opacity', selectedDay === null || d === selectedDay ? '1' : '0.3');
    });
  }

  function moveCursor(i) {
    if (!scale) return;
    const cx = scale.x(points[i][4]).toFixed(1);
    const cy = scale.y(points[i][2]).toFixed(1);
    cursorLine.setAttribute('x1', cx);
    cursorLine.setAttribute('x2', cx);
    cursorDot.setAttribute('cx', cx);
    cursorDot.setAttribute('cy', cy);
    cursorDot.setAttribute('fill', TRIP.days[points[i][5]].color);
  }

  // cum_km never decreases, so the nearest point by distance is found by
  // bisection rather than a scan over all the points on every pointer move.
  function nearestIndex(km) {
    let lo = 0;
    let hi = LAST;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (points[mid][4] < km) lo = mid + 1; else hi = mid;
    }
    if (lo > 0 && km - points[lo - 1][4] < points[lo][4] - km) lo -= 1;
    return lo;
  }

  function indexAtClientX(clientX) {
    const r = chart.getBoundingClientRect();
    const frac = Math.max(0, Math.min(1, (clientX - r.left - scale.left) / scale.plotW));
    return nearestIndex(frac * totals.km);
  }

  function render() {
    const W = Math.round(dock.getBoundingClientRect().width);
    const H = Math.round(chart.getBoundingClientRect().height);
    if (W < 80 || H < 40) return;
    while (chart.firstChild) chart.removeChild(chart.firstChild);
    chart.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

    const yTicks = [];
    for (let v = yDom.lo; v <= yDom.hi; v += yDom.step) {
      yTicks.push({ v: v, text: v.toLocaleString('en-CA') + (v === yDom.hi ? ' m' : '') });
    }
    // The left margin grows past 36px only when the labels need it, which
    // the unit on the top label can force with a wide system font.
    let left = PAD.left;
    const probe = svgEl('text', { x: 0, y: 0 });
    chart.appendChild(probe);
    yTicks.forEach(function (t) {
      probe.textContent = t.text;
      left = Math.max(left, Math.ceil(probe.getComputedTextLength()) + 8);
    });
    chart.removeChild(probe);

    const plotW = W - left - PAD.right;
    const plotH = H - PAD.top - PAD.bottom;
    const x = function (km) { return left + plotW * km / totals.km; };
    const y = function (m) { return PAD.top + plotH * (yDom.hi - m) / (yDom.hi - yDom.lo); };
    scale = { x: x, y: y, left: left, plotW: plotW };

    const grid = svgEl('g', { class: 'grid' });
    yTicks.forEach(function (t) {
      // Half pixel offset so the 1px line lands on one row of pixels.
      const gy = Math.round(y(t.v)) + 0.5;
      grid.appendChild(svgEl('line', { x1: left, x2: left + plotW, y1: gy, y2: gy }));
      const label = svgEl('text', { x: left - 6, y: gy, dy: '0.35em', 'text-anchor': 'end' });
      label.textContent = t.text;
      grid.appendChild(label);
    });
    const bottom = Math.round(PAD.top + plotH) + 0.5;
    for (let km = 0; km <= totals.km; km += X_STEP_KM) {
      const gx = Math.round(x(km)) + 0.5;
      grid.appendChild(svgEl('line', { x1: gx, x2: gx, y1: bottom, y2: bottom + 3 }));
      const label = svgEl('text', { x: gx, y: H - 5, 'text-anchor': 'middle' });
      label.textContent = km.toLocaleString('en-CA') + (km + X_STEP_KM > totals.km ? ' km' : '');
      grid.appendChild(label);
    }
    chart.appendChild(grid);

    // One path per segment, so the chart breaks at the same gaps the map does.
    const days = svgEl('g', {});
    dayGroups = TRIP.days.map(function (day) {
      const g = svgEl('g', { class: 'day' });
      day.segments.forEach(function (seg) {
        if (seg[1] <= seg[0]) return;
        let d = '';
        for (let i = seg[0]; i <= seg[1]; i++) {
          d += (i === seg[0] ? 'M' : 'L') + x(points[i][4]).toFixed(1) + ' ' + y(points[i][2]).toFixed(1);
        }
        g.appendChild(svgEl('path', {
          d: d, fill: 'none', stroke: day.color, 'stroke-width': 1.5,
          'stroke-linejoin': 'round', 'stroke-linecap': 'round'
        }));
      });
      days.appendChild(g);
      return g;
    });
    chart.appendChild(days);

    const cursor = svgEl('g', { class: 'cursor' });
    cursorLine = svgEl('line', { x1: left, x2: left, y1: PAD.top, y2: PAD.top + plotH });
    cursorDot = svgEl('circle', { r: 4, cx: left, cy: PAD.top });
    cursor.appendChild(cursorLine);
    cursor.appendChild(cursorDot);
    chart.appendChild(cursor);

    // A transparent rect over the plot takes the pointer so the paths and
    // labels underneath never swallow a move or a tap.
    const hit = svgEl('rect', { x: left, y: PAD.top, width: plotW, height: plotH, fill: 'transparent' });
    hit.addEventListener('pointerdown', function (e) {
      pressed = true;
      if (hit.setPointerCapture) hit.setPointerCapture(e.pointerId);
      setIndex(indexAtClientX(e.clientX), 'chart');
    });
    hit.addEventListener('pointermove', function (e) {
      // A finger only scrubs while it is down; a mouse scrubs on hover.
      if (e.pointerType === 'mouse' || pressed) setIndex(indexAtClientX(e.clientX), 'chart');
    });
    hit.addEventListener('pointerup', function () { pressed = false; });
    hit.addEventListener('pointercancel', function () { pressed = false; });
    chart.appendChild(hit);

    fadeChart();
    moveCursor(current);
  }

  // The dock changes width on rotation and when the desktop panel resizes
  // the map; one frame coalesces the bursts a resize produces.
  let renderFrame = 0;
  function scheduleRender() {
    if (renderFrame) return;
    renderFrame = requestAnimationFrame(function () { renderFrame = 0; render(); });
  }
  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(scheduleRender).observe(dock);
  } else {
    window.addEventListener('resize', scheduleRender);
  }

  render();
  setIndex(0, 'init');
})();
</script>
</body>
</html>
