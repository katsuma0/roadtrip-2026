  function whenLine(d, text, dated) {
    const line = el('span', 'when');
    line.setAttribute('aria-hidden', 'true');
    if (d !== null) {
      const sw = el('span', 'swatch');
      sw.style.background = TRIP.days[d].color;
      line.appendChild(sw);
    }
    const words = el('span', '', text);
    if (dated) {
      words.appendChild(el('span', 'wd', TRIP.days[d].weekday + ', '));
      words.appendChild(document.createTextNode(TRIP.days[d].label));
    }
    line.appendChild(words);
    return line;
  }
  const totalsEl = document.getElementById('totals');
  // The count up ends on the exact text written here, and formats the
  // numbers on the way with the same formatter so they never change style.
  const counters = [];
  totalGroups.forEach(function (group) {
    const list = el('dl', group[0]);
    group[1].forEach(function (item) {
      const wrap = el('div', item.hero ? 'hero' : (item.index === undefined ? '' : 'place'));
      wrap.appendChild(el('dt', '', item.label));
      const dd = el('dd');
      const value = item.hero ? totals.km : item.raw;
      let num;
      if (item.index === undefined) {
        num = fillValue(dd, item.value);
      } else {
        const jump = el('button', 'jump');
        num = fillValue(jump, item.value);
        jump.type = 'button';
        const d = TRIP.points[item.index][5];
        jump.setAttribute('aria-label', item.label + ' ' + item.value + (item.said ? ' ' + item.said : '') +

        jump.setAttribute('data-index', String(item.index));
        jump.addEventListener('click', function () { setIndex(item.index, 'jump'); });
        dd.appendChild(jump);
        // The day it happened, the same line the records carry.
        dd.appendChild(whenLine(d, item.how ? item.how + ', ' : '', true));
        wrap.appendChild(goIcon());
      }
      wrap.appendChild(dd);
      list.appendChild(wrap);
      counters.push({ node: num, text: num.textContent, to: value, fmt: item.hero ? fmt1 : fmtInt });
    });
    totalsEl.appendChild(list);
  });

  // Time in each province, in the order they were entered. Whole hours,
  // since the borders are drawn simply and a crossing can be minutes off.
  function fmtDuration(h) {
    const whole = Math.round(h);
    const days = Math.floor(whole / 24);
    const rest = whole - days * 24;
    // "2 d" rather than "2 d 0 h".
    if (days && !rest) return days + ' d';
    return (days ? days + ' d ' : '') + rest + ' h';
  }
  // The colour is a token per province, so it follows the theme.
  function provColour(code) { return 'var(--prov-' + code.toLowerCase() + ')'; }
  function provKey(code) {
    const key = el('span', 'prov-key');
    key.setAttribute('aria-hidden', 'true');
    key.style.setProperty('--prov', provColour(code));
    return key;
  }
  const provNames = {};
  TRIP.provinces.forEach(function (prov) { provNames[prov.code] = prov.name; });
  const provinceList = document.getElementById('province-list');
  const provMax = TRIP.provinces.reduce(function (m, p) { return Math.max(m, p.hours); }, 0) || 1;
  TRIP.provinces.forEach(function (prov) {
    // A div per pair is allowed inside a dl and gives the share bar a row.
    const item = el('div');
    item.style.setProperty('--share-of', String(prov.hours / provMax));
    const dt = el('dt');
    dt.appendChild(provKey(prov.code));
    dt.appendChild(document.createTextNode(prov.name));
    item.appendChild(dt);
    item.appendChild(el('dd', '', fmtDuration(prov.hours)));
    provinceList.appendChild(item);
  });

  // One date for a visit that began and ended on the same day, since
  // "Sep 9 to Sep 9" reads as a mistake.
  function dayLabelAt(i) { return TRIP.days[TRIP.points[i][5]].label; }
  function spanText(a, b) {
    const from = dayLabelAt(a);
    const to = dayLabelAt(b);
    return from === to ? from : from + ' to ' + to;
  }
  // A visit jumps to where it began, not its middle, so a scrub or play
  // from there follows it in the order it was driven.
  const visits = TRIP.province_visits || [];
  const timeline = document.getElementById('prov-timeline');
  const timelineNote = document.getElementById('prov-note');
  const visitBtns = visits.map(function (v, k) {
    const b = el('button', 'pv');
    b.type = 'button';
    b.style.flexGrow = String(v.hours);
    b.style.setProperty('--prov', provColour(v.code));
    v.text = spanText(v.from_idx, v.to_idx) + ', ' + fmtDuration(v.hours);
    b.setAttribute('data-prov', v.code);
    // The code first, as it is the text on the block, so "click BC" by
    // voice finds it.
    b.setAttribute('aria-label', v.code + ', ' + v.name + ', ' + v.text + ', show on map');
    const blk = el('span', 'blk');
    blk.setAttribute('aria-hidden', 'true');
    b.appendChild(blk);
    const lbl = el('span', 'lbl', v.code);
    lbl.setAttribute('aria-hidden', 'true');
    b.appendChild(lbl);
    b.addEventListener('click', function () { setIndex(v.from_idx, 'jump'); });
    ['pointerenter', 'focus'].forEach(function (type) {
      b.addEventListener(type, function () { noteVisit(k, true); });
    });
    ['pointerleave', 'blur'].forEach(function (type) {
      b.addEventListener(type, function () { noteVisit(-1, false); });
    });
    timeline.appendChild(b);
    return b;
  });
  // With nothing pointed at, the note falls back to the visit the marker
  // is in, so the blocks too narrow for a code still get named in words
  // as the marker passes them.
  let visitNow = -1;
  let visitPointed = -1;
  function noteVisit(k, pointed) {
    visitPointed = pointed ? k : -1;
    const show = visitPointed >= 0 ? visitPointed : visitNow;
    while (timelineNote.firstChild) timelineNote.removeChild(timelineNote.firstChild);
    if (show < 0) return;
    const v = visits[show];
    timelineNote.appendChild(provKey(v.code));
    timelineNote.appendChild(el('b', '', v.name));
    timelineNote.appendChild(el('span', '', v.text));
  }
  function visitAt(i) {
    for (let k = 0; k < visits.length; k++) if (i <= visits[k].to_idx) return k;
    return visits.length - 1;
  }
  // The previous and next visit buttons are the full size way to reach a
  // visit on touch, where the narrow blocks are a few pixels wide.
  const visitPrev = document.getElementById('pv-prev');
  const visitNext = document.getElementById('pv-next');
  function visitStepLabel(btn, word, k) {
    const ok = k >= 0 && k < visits.length;
    btn.setAttribute('aria-disabled', ok ? 'false' : 'true');
    btn.setAttribute('aria-label', ok ? word + ', ' + visits[k].name + ', ' + visits[k].text + ', show on map' : word);
  }
  function stepVisit(dir) {
    const k = visitNow + dir;
    if (k >= 0 && k < visits.length) setIndex(visits[k].from_idx, 'jump');
  }
  visitPrev.addEventListener('click', function () { stepVisit(-1); });
  visitNext.addEventListener('click', function () { stepVisit(1); });
  function markVisit(i) {
    const k = visitAt(i);
    if (k === visitNow) return;
    if (visitNow >= 0) {
      visitBtns[visitNow].classList.remove('current');
      visitBtns[visitNow].removeAttribute('aria-current');
    }
    visitNow = k;
    if (k >= 0) {
      visitBtns[k].classList.add('current');
      // Read on focus only, so playback passing a border says nothing.
      visitBtns[k].setAttribute('aria-current', 'true');
    }
    visitStepLabel(visitPrev, 'Previous visit', k - 1);
    visitStepLabel(visitNext, 'Next visit', k + 1);
    if (visitPointed < 0) noteVisit(-1, false);
  }

  function weekdayLabel(d) { return TRIP.days[d].weekday + ', ' + TRIP.days[d].label; }
  // Records. A day record picks its day; the longest stay is a place, so
  // it puts the marker there like the places in the totals.
  const recordList = document.getElementById('record-list');
  const recordCards = [];
  (TRIP.records || []).forEach(function (rec) {
    const wrap = el('div', 'place rec');
    wrap.appendChild(el('dt', '', rec.label));
    const dd = el('dd');
    const jump = el('button', 'jump');
    jump.type = 'button';
    // The first space splits the figure from what it counts, so "3
    // nights" keeps "nights" small beside the number. That space is where
    // a narrow card may break the line; any later ones are no-break, so
    // a unit of two words goes under the figure whole.
    const sp = rec.value_text.indexOf(' ');
    jump.appendChild(el('span', 'num', sp < 0 ? rec.value_text : rec.value_text.slice(0, sp)));
    if (sp >= 0) jump.appendChild(el('span', 'unit', ' ' + rec.value_text.slice(sp + 1).replace(/ /g, '\u00a0')));
    const spot = rec.idx === null ? null : TRIP.nights.filter(function (n) { return n.idx === rec.idx; })[0];
    let when = '';
    if (spot) when = spot.nights > 1 ? spot.from_label + ' to ' + spot.to_label : 'Night of ' + spot.from_label;
    else if (rec.day !== null) when = weekdayLabel(rec.day);
    jump.setAttribute('aria-label', rec.label + ' ' + rec.value_text + ', ' + when + (rec.idx === null ? ', show this day' : ', show on map'));
    // The longest stay opens the day it began on and puts the marker on
    // the spot, so the card, the chart and the map show the same place.
    jump.addEventListener('click', function (e) {
      // The end of a pull on the sheet is not a tap on the record.
      if (e.detail && performance.now() - dragEndedAt < 400) return;
      if (rec.day !== null) selectDay(rec.day, 'record', jump, rec.idx === null ? undefined : rec.idx);
      else if (rec.idx !== null) setIndex(rec.idx, 'jump');
    });
    dd.appendChild(jump);
    dd.appendChild(whenLine(rec.day, when));
    wrap.appendChild(dd);
    wrap.appendChild(goIcon());
    recordList.appendChild(wrap);
    if (rec.day !== null) recordCards.push({ node: wrap, button: jump, day: rec.day });
  });

  // Day table. The row button carries the accessible name and pressed
  // state; the click is handled once on the tbody so a tap on the numbers
  // selects the day too without firing twice when the button is hit.
  const tbody = document.getElementById('day-rows');
  const trs = [];
  const kmMax = TRIP.days.reduce(function (m, day) { return Math.max(m, day.km); }, 0) || 1;
  const kmBars = [];
  const rows = TRIP.days.map(function (day, d) {
    const tr = el('tr');
    tr.setAttribute('data-day', String(d));
    const btn = el('button', 'day-row');
    btn.type = 'button';
    btn.setAttribute('data-day', String(d));
    btn.setAttribute('aria-pressed', 'false');
    const swatch = el('span', 'swatch');
    swatch.style.background = day.color;
    btn.appendChild(swatch);
    btn.appendChild(el('span', 'day-label', day.label));
    btn.appendChild(el('span', 'wd', day.weekday));
    // The flex row drops the space between the two spans, so the name is
    // spelled out with a comma, in the same order as the text.
    btn.setAttribute('aria-label', day.label + ', ' + day.weekday);
    const first = el('td');
    first.appendChild(btn);
    tr.appendChild(first);
    const kmCell = el('td', 'km', fmt1(day.km));
    const bar = el('i', 'kmbar');
    bar.setAttribute('aria-hidden', 'true');
    const fill = el('i');
    fill.style.setProperty('--k', String(day.km / kmMax));
    fill.style.background = day.color;
    bar.appendChild(fill);
    kmCell.appendChild(bar);
    kmBars.push(fill);
    tr.appendChild(kmCell);
    tr.appendChild(el('td', '', fmt1(day.moving_h)));
    tr.appendChild(el('td', '', fmtInt(day.gain_m)));
    tbody.appendChild(tr);
    trs.push(tr);
    return btn;
  });
  // A mouse over a row lifts its day above the others on the map, a
  // little heavier, and deepens its area on the chart, so the table and
  // the map read as one. The day before goes back into date order first.
  // Not while a day is picked or the trip plays: those own the look.
  function hoverRow(d) {
    if (d === hoverDay) return;
    const was = hoverDay;
    hoverDay = selectedDay === null && !playing ? d : null;
    if (was !== null) raiseDays(was + 1, TRIP.days.length - 1);
    if (hoverDay !== null) raiseDays(hoverDay, hoverDay);
    styleDays();
  }
  tbody.addEventListener('pointerover', function (e) {
    if (e.pointerType !== 'mouse') return;
    const tr = e.target.closest('tr[data-day]');
    if (tr) hoverRow(Number(tr.getAttribute('data-day')));
  });
  tbody.addEventListener('pointerleave', function () { hoverRow(null); });
  tbody.addEventListener('click', function (e) {
    // The end of a pull on the sheet is not a pick.
    if (e.detail && performance.now() - dragEndedAt < 400) return;
    const tr = e.target.closest('tr[data-day]');
    if (tr) selectDay(Number(tr.getAttribute('data-day')), 'row', tr.querySelector('.day-row'));
  });

  // Sorting moves the existing rows rather than rebuilding them, so the
  // selection and the buttons' state survive. Ties fall back to date order.
  const headers = Array.prototype.slice.call(document.querySelectorAll('#days th'));
  const CARET_UP = 'M4 1.5 7.5 6.5H.5z';
  const CARET_DOWN = 'M4 6.5 7.5 1.5H.5z';
  headers.forEach(function (th) {
    const caret = svgEl('svg', { class: 'caret', viewBox: '0 0 8 8', 'aria-hidden': 'true', focusable: 'false' });
    caret.appendChild(svgEl('path', { d: CARET_UP }));
    th.firstElementChild.appendChild(caret);
  });
  let sortKey = null;
  let sortDir = 'ascending';
  function sortValue(d) {
    return sortKey === 'date' ? d : TRIP.days[d][sortKey];
  }
  // The first week shows by default. Opening and closing animate the
  // wrapper's height; the newly shown rows rise in one after another.
  const daysTable = document.getElementById('days');
  const daysWrap = document.getElementById('days-wrap');
  const moreBtn = document.getElementById('days-more');
  const moreText = moreBtn.querySelector('.more-text');
  const FIRST_WEEK = 7;
  let daysOpen = false;
  let daysAnim = null;
  function labelMore() {
    moreText.textContent = daysOpen ? 'Show the first week' : 'Show all ' + TRIP.days.length + ' days';
  }
  labelMore();
  moreBtn.hidden = TRIP.days.length <= FIRST_WEEK;
  function setDaysOpen(open, animate) {
    if (open === daysOpen) return;
    if (daysAnim) { daysAnim.cancel(); daysAnim = null; }
    const from = daysWrap.offsetHeight;
    daysTable.classList.toggle('collapsed', !open);
    const to = daysWrap.offsetHeight;
    daysOpen = open;
    moreBtn.setAttribute('aria-expanded', String(open));
    labelMore();
    if (!animate || !canAnimate || from === to) return;
    // Closing keeps the rows until the height has run down to them, so the
    // list folds away instead of vanishing and leaving a gap to close.
    if (!open) daysTable.classList.remove('collapsed');
    daysWrap.style.overflow = 'hidden';
    holdMotion('days', 420);
    daysAnim = daysWrap.animate([{ height: from + 'px' }, { height: to + 'px' }],
      { duration: 380, easing: EASE_UI });
    daysAnim.onfinish = daysAnim.oncancel = function () {
      daysWrap.style.overflow = '';
      if (!daysOpen) daysTable.classList.add('collapsed');
      daysAnim = null;
    };
    if (open) {
      Array.prototype.slice.call(tbody.children, FIRST_WEEK).forEach(function (tr, k) {
        tr.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }],
          { duration: 260, delay: Math.min(k, 12) * 18, easing: EASE_UI, fill: 'backwards' });
      });
    } else {
      // Keep the button where the eye is: the list shrinks above it.
      moreBtn.scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
    }
  }
  moreBtn.addEventListener('click', function () { setDaysOpen(!daysOpen, true); });

  function sortRows(key) {
    if (key === sortKey) {
      sortDir = sortDir === 'ascending' ? 'descending' : 'ascending';
    } else {
      sortKey = key;
      // Dates read oldest first; for the numbers the big day is the one
      // people look for, so those start at the top.
      sortDir = key === 'date' ? 'ascending' : 'descending';
    }
    const sign = sortDir === 'ascending' ? 1 : -1;
    const order = TRIP.days.map(function (day, d) { return d; });
    order.sort(function (a, b) {
      const va = sortValue(a);
      const vb = sortValue(b);
      if (va === vb) return a - b;
      return va < vb ? -sign : sign;
    });
    order.forEach(function (d) { tbody.appendChild(trs[d]); });
    headers.forEach(function (th) {
      const btn = th.firstElementChild;
      if (btn.getAttribute('data-sort') === sortKey) {
        th.setAttribute('aria-sort', sortDir);
        btn.querySelector('path').setAttribute('d', sortDir === 'ascending' ? CARET_UP : CARET_DOWN);
      } else {
        th.removeAttribute('aria-sort');
      }
    });
    revealSelected();
  }
  document.querySelector('#days thead').addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-sort]');
    if (btn) sortRows(btn.getAttribute('data-sort'));
  });

  let selectedDay = null;

  // how says where the pick came from: 'row' (a toggle, the list's own
  // clear control, the same as Escape), 'record', 'step' (the card's
  // previous and next), 'close' and 'escape', or 'leave' (the marker was
  // sent to another day). from is the control to give the focus back to
  // when the card closes. at is a fix of the day to put the marker on.
  function selectDay(d, how, from, at) {
    if (d === selectedDay && (how === 'row' || how === undefined)) d = null;
    // A record for the day already picked only brings the card back.
    if (d === selectedDay) {
      if (d !== null) showCard(d, how, from, d);
      if (d !== null && at !== undefined) setIndex(at, 'night');
      return;
    }
    // A day picked while playing should stay on screen, but the pan that
    // follows the marker would drag the view away within a frame, so
    // playback pauses. Selection only happens on user input, long after
    // the script has finished. The pause comes first, so it puts the
    // stacking back in date order before the picked day goes on top.
    if (d !== null && playing) stopPlay();
    if (d !== null) { hoverDay = null; clearBeats(); }
    const before = selectedDay;
    selectedDay = d;
    // Playback running on past the picked day lets it go; the days driven
    // so far go back above the ones ahead, as they are while playing.
    if (selectedDay !== null) raiseDays(selectedDay, selectedDay);
    else if (playing) raiseDays(0, shownDay);
    styleDays();
    rows.forEach(function (row, i) {
      row.setAttribute('aria-pressed', i === selectedDay ? 'true' : 'false');
      // The tint goes on the row, not the button, so the numbers read as
      // selected along with the label.
      trs[i].classList.toggle('selected', i === selectedDay);
    });
    recordCards.forEach(function (r) {
      r.node.classList.toggle('current', r.day === selectedDay);
      if (r.day === selectedDay) r.button.setAttribute('aria-current', 'true');
      else r.button.removeAttribute('aria-current');
    });
    if (selectedDay === null) hideCard(how); else showCard(selectedDay, how, from, before);
    markHandle();
    // The readout, slider and chart cursor go to the picked day too, or
    // the readout above the zoomed chart would name a place it cannot
    // show. A marker already on the day stays where it was put.
    if (selectedDay !== null) {
      if (at === undefined && (current < dayLo[d] || current > dayHi[d])) at = driveStart[d];
      if (at !== undefined) setIndex(at, 'select');
    }
    zoomChart(selectedDay === null ? fullDom() : dayDom(selectedDay));
    // A pick let go because the marker went elsewhere keeps the view: the
    // marker's own pan takes it there, and a fit out to the whole trip
    // first would zoom out and then pan.
    if (how !== 'leave') fitTo(selectedDay === null ? trackBounds : dayBounds[selectedDay]);
  }

  // Puts days first to last above the rest, in that order. The markers
  // must stay on top of whichever lines were just raised. Raise before a
  // restyle: a moved path loses its computed style, so a change made
  // before the next style pass has nothing to ease from and cuts. The
  // read at the end is that pass, once per call.
  function raiseDays(first, last) {
    let moved = null;
    for (let d = first; d <= last; d++) {
      dayLayers[d].eachLayer(function (layer) { layer.bringToFront(); moved = layer.getElement() || moved; });
    }
    startMarker.bringToFront();
    finishMarker.bringToFront();
    if (moved) void getComputedStyle(moved).strokeWidth;
  }

  // How each day is drawn: picked, faded behind a picked day, ahead of the
  // playing marker, or plain. Only days whose look changed are restyled,
  // since playback asks again every time the marker enters a new day.
  const dayLooks = [];
  // The day row under the mouse, lifted on the map and the chart.
  let hoverDay = null;
  function dayLook(d) {
    if (selectedDay !== null) return d === selectedDay ? 'picked' : 'faded';
    if (!playing && d === hoverDay) return 'hover';
    return playing && d > points[current][5] ? 'ahead' : 'plain';
  }
  function styleDays() {
    dayLayers.forEach(function (group, i) {
      const look = dayLook(i);
      if (dayLooks[i] === look) return;
      dayLooks[i] = look;
      const opacity = look === 'faded' ? FADED_OPACITY : look === 'ahead' ? AHEAD_OPACITY : LINE_OPACITY;
      const weight = look === 'picked' ? SELECTED_WEIGHT : look === 'hover' ? LINE_WEIGHT + 1.5 : LINE_WEIGHT;
      // A faded day is thin and pale already; its casing would only add a
      // grey smear, so it goes away with the fade. A day ahead keeps a
      // lighter one so it still reads as the route still to come.
      const casing = look === 'faded' ? 0 : look === 'ahead' ? CASING_OPACITY * AHEAD_OPACITY : CASING_OPACITY;
      dayShades[i].forEach(function (shade) {
        shade.setStyle({ opacity: casing / CASING_OPACITY, weight: weight + 4 });
      });
      group.eachLayer(function (layer) {
        if (layer.options.className === 'casing') {
          layer.setStyle({ opacity: casing, weight: weight + 3 });
        } else if (layer instanceof L.Polyline) {
          layer.setStyle({ opacity: opacity, weight: weight });
        } else {
          layer.setStyle({ opacity: opacity, fillOpacity: opacity });
        }
      });
    });
    // A stop belongs to the day that ended there and to each day that
    // started there, one per night (the trip has a day for every date);
    // the rest fade with their lines, or the dots on pale lines would be
    // the loudest marks left outside the selected day.
    nightDots.forEach(function (dot, k) {
      const spot = TRIP.nights[k];
      const from = points[spot.idx][5];
      let o = 1;
      if (selectedDay !== null) {
        o = selectedDay >= from && selectedDay <= from + spot.nights ? 1 : FADED_OPACITY;
      } else if (dayLooks[from] === 'ahead') {
        o = AHEAD_OPACITY;
      }
      if (dot.options.opacity !== o) dot.setStyle({ opacity: o, fillOpacity: o });
    });
    fadeChart();
  }

  // Not scrollIntoView: the sticky header paints over the scrollport
  // without shrinking it, so a row tucked under the header counts as
  // visible and never moves. The room kept at the top is the stats'
  // scroll-padding (the header, and on a phone the fade under the dock),
  // read from CSS so the two never disagree, and the scroll glides there.
  // A sort or the sheet opening can move the selected row too, so they
  // call this as well.
  function revealSelected() {
    const stats = document.getElementById('stats');
    // A day picked from the map, the chart or a record may sit past the
    // first week; the list opens so its row can be shown.
    if (selectedDay !== null && !daysOpen && tbody.children.length > FIRST_WEEK &&
        Array.prototype.indexOf.call(tbody.children, trs[selectedDay]) >= FIRST_WEEK) {
      setDaysOpen(true, false);
    }
    if (selectedDay === null || stats.clientHeight === 0) return;
    const row = trs[selectedDay].getBoundingClientRect();
    const box = stats.getBoundingClientRect();
    const cs = getComputedStyle(stats);
    const head = document.querySelector('#days thead').offsetHeight;
    // On a phone on its side the open stats can be 76px, too short for a
    // row and the full padding; the header alone is then the limit.
    const bottom = Math.max(0, Math.min(parseFloat(cs.scrollPaddingBottom) || 0, box.height - head - row.height));
    const room = box.height - bottom - row.height;
    const top = Math.max(head, Math.min(parseFloat(cs.scrollPaddingTop) || 0, room));
    // Rounded up because scrollTop lands on whole pixels and a half
    // pixel short still clips the row's border.
    let to = null;
    if (row.top < box.top + top) {
      to = stats.scrollTop - Math.ceil(box.top + top - row.top);
    } else if (row.bottom > box.bottom - bottom) {
      to = stats.scrollTop + Math.ceil(row.bottom - box.bottom + bottom);
    }
    if (to !== null) stats.scrollTo({ top: to, behavior: reduceMotion ? 'auto' : 'smooth' });
  }

  // The day card. It is the picked day's page: picking a day from the
  // table or a record brings the panel up to it and puts the focus on its
  // heading, and closing it goes back to the row or record it came from,
  // scrolled to where the list was, the way a detail view goes back.
  const card = document.getElementById('daycard');
  const cardTitle = document.getElementById('dc-title');
  const cardBody = card.querySelector('.dc-body');
  const cardKicker = card.querySelector('.dc-kicker .text');
  const cardSwatch = card.querySelector('.dc-kicker .swatch');
  const cardWhen = card.querySelector('.dc-when');
  const cardStats = card.querySelector('.dc-stats');
  const cardRecs = card.querySelector('.dc-recs');
  const cardWx = card.querySelector('.dc-wx');
  const cardProvs = card.querySelector('.dc-provs');
  const cardNight = card.querySelector('.dc-night');
  const cardLive = document.getElementById('dc-live');
  const prevBtn = document.getElementById('dc-prev');
  const nextBtn = document.getElementById('dc-next');
  const underCard = [totalsEl, document.getElementById('records'), document.getElementById('days-head'),
    document.getElementById('days'), document.getElementById('provinces')];
  const CARD_MS = 320;
  let cardDay = null;
  let cardFrom = null;
  // Kept so closing the card can put the list back where the reader was.
  let restoreTop = 0;
  let cardOut = null;
  let cardWait = null;

  // The stats scroll smoothly from CSS, so a correction that must not be
  // seen says so.
  function scrollStats(top, smooth) {
    if (smooth && !reduceMotion) {
      statsBox.scrollTo({ top: top, behavior: 'smooth' });
      return;
    }
    statsBox.style.scrollBehavior = 'auto';
    statsBox.scrollTop = top;
    statsBox.style.scrollBehavior = '';
  }
  // When the card comes, goes or changes height, what is under it in view
  // glides from where it was instead of jumping.
  // from and to are offsets from where each section now sits; a close
  // runs the other way and holds its end until the card is taken out.
  let underAnims = [];
  function slideUnder(from, to) {
    to = to || 0;
    if (!canAnimate || Math.abs(from - to) < 1) return;
    holdMotion('card', CARD_MS + 20);
    // Only what can be seen moves: each moving section is a layer that has
    // to be drawn whole first, and the table alone is 1,200px tall.
    const view = statsBox.getBoundingClientRect();

  // Playback runs the whole trip in a minute at a steady speed along the
  // road, one frame at a time, so a long day takes longer than a short
  // one. Gaps over 6 hours, where the device was off, are crossed at once
  // rather than drawn as a slow straight line, and so are fixes taken
  // standing still. The loop only runs while playing.
  const PLAY_MS = 60000;

  let playClock = null;

  let playF = 0;
  // A picked day plays on its own clock: five seconds, and up to three

  // blink. At the whole trip's pace a short day was gone in under a second.
  function dayPlayRate(d) {

  function playStep(t) {

  const Y_STEPS = [100, 200, 250, 500, 1000];

  // Labels like "12,000 km" need about 70px each, so a narrow dock on a

  function xStepKm(plotW) { return plotW < 380 ? 4000 : 2000; }

  let eleMin = Infinity;
  let eleMax = -Infinity;

  // phone and desktop layouts. Only the content is held (the two readings
  // are content-box): the divider's padding changes between layouts, and
  // a width that held the load-time padding would be short after a turn.

  // to a wider layout finds the width already held.
  function holdWidth(node, texts) {
    node.style.display = 'inline-block';
    const cs = getComputedStyle(node);
    const px = parseFloat(cs.fontSize) || 12;
    const extra = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.borderLeftWidth) || 0);
    let w = 0;
    texts.forEach(function (t) {
      readN[node.id].textContent = t;

    });

    node.style.display = '';
  }
  holdWidth(readEle, [fmtInt(eleMax), fmtInt(eleMin)]);
  let tMin = Infinity;
  let tMax = -Infinity;
  WX.forEach(function (w) { if (w) { tMin = Math.min(tMin, Math.round(w[0])); tMax = Math.max(tMax, Math.round(w[0])); } });
  if (tMax >= tMin) holdWidth(readTemp, [minus(String(tMin)), minus(String(tMax))]);
  // The domain rounds out to the first step that gives at least 3 ticks

  // desktop gets every 500. A floor within the noise band below sea level
  // snaps to 0 instead of to a tick a whole step further down.
  function yDomain(plotH) {

    let fit = null;
    for (let s = 0; s < Y_STEPS.length; s++) {
      const step = Y_STEPS[s];
      let lo = Math.floor(eleMin / step) * step;
      if (lo < 0 && eleMin > -SEA_NOISE_M) lo = 0;
      const hi = Math.ceil(eleMax / step) * step;

      const spans = (hi - lo) / step;

  let scale = null;
  let cursorGroup = null;
  let cursorDot = null;
  // Where the cursor was last put, as numbers: the transform read back
  // from the style comes normalised ("67px, 0px") and never matches.
  let cursorX = null;
  let cursorY = null;
  let cursorTimer = 0;
  let dayGroups = [];
  let pressed = false;
  // The day lines and areas sit in one group drawn in km along x, so a
  // zoom is one transform on it rather than every path redrawn.
  let zoomG = null;
  let tickG = null;
  let cursorZoom = null;
  let cursorDotZoom = null;
  // The elevation range shown, and the whole trip's one the paths are
  // drawn in; a picked day fits the y axis to its own range.
  let yBase = null;
  let yDom = null;
  let yG = null;
  // Province boundaries and codes, and the high point, laid over the plot.
  let provG = null;
  let provMarks = [];
  let peakG = null;
  let peakText = null;
  let peakW = 0;
  // The last size drawn, so a resize that ends where it began, such as

  let drawnW = 0;
  let drawnH = 0;

  // The chart repeats the map: faded behind a picked day, dimmed ahead of
  // the playing marker. A style, not the attribute, so it eases.
  function fadeChart() {
    dayGroups.forEach(function (g, d) {
      const look = dayLooks[d];

      g.classList.toggle('hot', look === 'hover');
    });
  }

  // The cursor moves by transform, the line and the dot drawn at zero, so

    if (cursorDotZoom) { cursorDotZoom.cancel(); cursorDotZoom = null; }
    let km = points[i][4];
    let ele = points[i][2];

      ele += (points[i + 1][2] - ele) * frac;
    }
    const cx = Number(scale.x(km).toFixed(1));
    const cy = Number(yAt(ele, yDom).toFixed(1));

  const dayLo = [];

    // the other sides, and it stays inside the chart.
    function fits(side) {
      const b = box(side);

    }
    let side = peakSide;
    if (side === undefined) side = ['start', 'end', 'top'].filter(fits)[0];
    if (side === undefined) {
      // Nowhere clear: the side that keeps the codes, and against the
      // right edge the left of the dot.
      side = losesCode('start') || px + 6 + peakW > right ? 'end' : 'start';
    }
    out.codes = place(side);
    peak.side = side;
    peak.ty = topY(py);
    return out;
  }
  // Above its dot the label's baseline sits 8px up, or as far as the top
  // of the chart allows on a short one; 6px up still clears the dot's ring.
  function topY(py) { return -Math.min(8, Math.round((py - 8) * 10) / 10); }
  function applyMarks(lay) {
    lay.bounds.forEach(function (x, k) {
      if (provMarks[k].line) provMarks[k].line.style.transform = 'translate(' + (Math.round(x) + 0.5) + 'px, 0px)';
    });
    lay.codes.forEach(function (c, k) {
      const t = provMarks[k].text;
      t.style.transform = 'translate(' + c.x.toFixed(1) + 'px, 0px)';
      t.style.opacity = c.show ? '1' : '0';
    });
    peakG.style.transform = 'translate(' + lay.peak.x.toFixed(1) + 'px, ' + lay.peak.y.toFixed(1) + 'px)';
    peakG.style.opacity = lay.peak.show ? '1' : '0';
    const side = lay.peak.side;
    peakText.setAttribute('x', side === 'end' ? -6 : side === 'top' ? 0 : 6);
    peakText.setAttribute('y', side === 'top' ? lay.peak.ty : 0);
    peakText.setAttribute('dy', side === 'top' ? '0' : '0.35em');
    peakText.setAttribute('text-anchor', side === 'end' ? 'end' : side === 'top' ? 'middle' : 'start');
  }

  // Ticks on round steps for the range shown. The whole trip keeps its
  // 2,000 km steps (4,000 on a narrow dock); a day takes the smallest of
  // 1, 2 or 5 times a power of ten that leaves room for its labels. The
  // group goes into the chart before its labels are measured: text that is
  // not in the document measures 0 wide. It is added before next.
  const NF_KM = new Intl.NumberFormat('en-CA', { maximumFractionDigits: 1 });
  function drawTicks(dom, parent, next) {
    if (isFull(dom)) return layTicks(dom, xStepKm(scale.plotW), parent, next);
    // One spacing at every width, about the whole trip's at its
    // narrowest, so the axis keeps its density when a day is picked;
    // the widest label, "12,450 km", still has clear space either side.
    const room = 64;
    const raw = dom.w * room / scale.plotW;
    const mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
    const steps = [mag / 2, mag, 2 * mag, 5 * mag, 10 * mag];
    let k = steps.length - 1;
    while (k > 0 && steps[k - 1] >= raw) k--;
    // A single label says where the day is but not how long it is, which
    // on a 320px dock happens to about one day in four, so the step goes
    // down a notch until two labels show. Two notches down still leaves
    // about a fifth of the plot between labels.
    let g = layTicks(dom, steps[k], parent, next);
    for (let tries = 0; tries < 2 && k > 0 && g.querySelectorAll('text').length < 2; tries++) {
      g.parentNode.removeChild(g);
      g = layTicks(dom, steps[--k], parent, next);
    }
    return g;
  }
  function layTicks(dom, step, parent, next) {
    const full = isFull(dom);
    const kms = [];
    for (let km = full ? 0 : Math.ceil(dom.a / step) * step; km <= dom.a + dom.w + 1e-6; km += step) {
      kms.push(Math.round(km * 10) / 10);
    }
    const g = svgEl('g', { class: 'grid xticks' });
    parent.insertBefore(g, next || null);
    let prev = null;
    kms.forEach(function (km, k) {
      const gx = Math.round(xAt(km, dom)) + 0.5;
      const t = svgEl('g', {});
      t.style.transform = 'translate(' + gx + 'px, 0px)';
      t.setAttribute('data-km', String(km));
      t.appendChild(svgEl('line', { class: 'tick', x1: 0, x2: 0, y1: scale.bottom, y2: scale.bottom + 3 }));
      g.appendChild(t);
      // The origin keeps its tick but not a label: the 0 m beside it
      // already marks the corner, and two zeros there read as one blur.
      if (km === 0) return;
      const label = svgEl('text', { x: 0, y: scale.H - 5, 'text-anchor': 'middle' });
      label.textContent = NF_KM.format(km) + (k === kms.length - 1 ? ' km' : '');
      t.appendChild(label);
      // A zoomed day's first step can land on the plot's left edge, where
      // its label would run into the elevation labels; it keeps its tick.
      const half = label.getComputedTextLength() / 2;
      if (gx - half < scale.left - 2) {
        t.removeChild(label);
        return;
      }
      // The last label carries the unit and sits near the right edge, so
      // it is pulled in to end at the edge rather than run past it.
      let lo = gx - half;
      if (gx + half > scale.W) {
        label.setAttribute('x', String(scale.W - gx));
        label.setAttribute('text-anchor', 'end');
        lo = scale.W - half * 2;
      }
      // Pulled in, it can reach the label before it; the one with the
      // unit stays, the other keeps its tick.
      if (prev && prev.hi > lo - 6) prev.t.removeChild(prev.label);
      prev = { t: t, label: label, hi: gx + half };
    });
    return g;
  }

  // Picking a day zooms the chart to it and clearing it zooms back out,
  // over 400ms. The zoom is even in scale, the way a map zooms, about the
  // one point that stays put between the two ranges, so the day grows out
  // of where it sat. It runs as keyframes worked out here once, with the
  // same easing as the rest of the page, so no script runs per frame; the
  // old ticks ride out with the zoom and fade, the new ones ride in.
  const ZOOM_MS = 400;
  let zoomAnims = [];
  let leavingTicks = [];
  function stopZoom() {
    zoomAnims.forEach(function (a) { a.cancel(); });
    zoomAnims = [];
    if (cursorZoom) { cursorZoom.cancel(); cursorZoom = null; }
    if (cursorDotZoom) { cursorDotZoom.cancel(); cursorDotZoom = null; }
    leavingTicks.forEach(function (g) { if (g.parentNode) g.parentNode.removeChild(g); });
    leavingTicks = [];
    motion('zoom', false);
  }
  // Where the zoom is now, read back from the running transform, so a new
  // pick mid zoom starts from what is on screen.
  function shownMatrix() {
    if (!zoomAnims.length || !zoomG) return null;
    const m = new DOMMatrix(getComputedStyle(zoomG).transform);
    return m.a > 0 && m.d > 0 ? m : null;
  }
  function shownDom() {
    const m = shownMatrix();
    if (!m) return xDom;
    return { a: (scale.left - m.e) / m.a, w: scale.plotW / m.a };
  }
  function shownYDom() {
    const m = shownMatrix();
    if (!m) return yDom;
    const span = (yBase.hi - yBase.lo) / m.d;
    const hi = yBase.hi + (m.f - PAD.top * (1 - m.d)) * span / scale.plotH;
    return { lo: hi - span, hi: hi, step: yDom.step };
  }
  function lerpDom(from, to, p) {
    const r = to.w / from.w;
    if (Math.abs(Math.log(r)) < 0.01) {
      return { a: from.a + (to.a - from.a) * p, w: from.w + (to.w - from.w) * p };
    }
    const w = from.w * Math.pow(r, p);
    const fixed = (from.a * to.w - to.a * from.w) / (to.w - from.w);
    return { a: fixed - (fixed - from.a) * w / from.w, w: w };
  }
  // A label or mark that leaves fades out early in the zoom, and one
  // that arrives fades in late, the same as the ticks.
  function fadeOut(p) { return Math.max(0, 1 - p * 2.5); }
  function fadeInLate(p) { return Math.max(0, Math.min(1, (p - 0.4) / 0.6)); }
  function crossShow(a, b) {
    if (a && b) return function () { return 1; };
    if (b) return fadeInLate;
    if (a) return fadeOut;
    return function () { return 0; };
  }
  function zoomChart(to) {
    const from = scale && zoomG ? shownDom() : xDom;
    const fromY = scale && zoomG ? shownYDom() : yDom;
    xDom = to;
    if (!scale || !zoomG) return;
    // A hover label left from before would point at a spot the new range
    // has moved, or taken out of view; the next pointer move brings it back.
    hideHover();
    // Ticks still fading in from a zoom cut short fade out from where they
    // got to, not from full strength, or stepping days quickly would flash
    // every half faded label before it goes.
    const opacities = function (g) {
      return zoomAnims.length && g
        ? Array.prototype.map.call(g.children, function (t) { return Number(getComputedStyle(t).opacity); })
        : null;
    };
    const shown = opacities(tickG);
    const shownY = opacities(yG);
    stopZoom();
    yDom = yDomainFor(to);
    // The new state goes on first, so it holds when the keyframes end.
    zoomG.style.transform = zoomTransform(to, yDom);
    const old = tickG;
    tickG = drawTicks(to, old.parentNode, old.nextSibling);
    const oldY = yG;
    yG = drawYGrid(yDom, oldY.parentNode, oldY.nextSibling);
    const lay = layoutMarks(to, yDom);
    applyMarks(lay);
    moveCursor(current);
    const same = Math.abs(from.a - to.a) < 0.01 && Math.abs(from.w - to.w) < 0.01 &&
      Math.abs(fromY.lo - yDom.lo) < 0.5 && Math.abs(fromY.hi - yDom.hi) < 0.5;
    if (!canAnimate || same) {
      old.parentNode.removeChild(old);
      oldY.parentNode.removeChild(oldY);
      return;
    }
    const N = 24;
    const doms = [];
    const ydoms = [];
    for (let k = 0; k <= N; k++) {
      doms.push(lerpDom(from, to, k / N));
      ydoms.push({ lo: fromY.lo + (yDom.lo - fromY.lo) * k / N, hi: fromY.hi + (yDom.hi - fromY.hi) * k / N });
    }
    const timing = { duration: ZOOM_MS, easing: EASE_UI };
    motion('zoom', true);
    const main = zoomG.animate(doms.map(function (d, k) { return { transform: zoomTransform(d, ydoms[k]) }; }), timing);
    zoomAnims.push(main);
    function ride(node, km, fade, fill) {
      zoomAnims.push(node.animate(doms.map(function (d, k) {
        return { transform: 'translate(' + xAt(km, d).toFixed(1) + 'px, 0px)', opacity: fade(k / N) };
      }), Object.assign({ fill: fill }, timing)));
    }
    function rideY(node, v, fade, fill) {
      zoomAnims.push(node.animate(ydoms.map(function (yd, k) {
        return { transform: 'translate(0px, ' + (yAt(v, yd) + 0.5).toFixed(1) + 'px)', opacity: fade(k / N) };
      }), Object.assign({ fill: fill }, timing)));
    }
    // The old ticks hold their faded end until they are taken out, so the
    // frame between the end of the zoom and their removal never shows them.
    leavingTicks.push(old, oldY);
    Array.prototype.forEach.call(old.children, function (t, k) {
      const o = shown && shown[k] < 1 ? shown[k] : 1;
      ride(t, Number(t.getAttribute('data-km')), function (p) { return o * fadeOut(p); }, 'forwards');
    });
    Array.prototype.forEach.call(tickG.children, function (t) {
      ride(t, Number(t.getAttribute('data-km')), fadeInLate, 'none');
    });
    Array.prototype.forEach.call(oldY.children, function (t, k) {
      const o = shownY && shownY[k] < 1 ? shownY[k] : 1;
      rideY(t, Number(t.getAttribute('data-v')), function (p) { return o * fadeOut(p); }, 'forwards');
    });
    Array.prototype.forEach.call(yG.children, function (t) {
      rideY(t, Number(t.getAttribute('data-v')), fadeInLate, 'none');
    });
    // The province marks and the high point ride along by translate only.
    const lays = doms.map(function (d, k) { return layoutMarks(d, ydoms[k], lay.peak.side); });
    const first = lays[0];
    provMarks.forEach(function (m, k) {
      if (m.line) {
        zoomAnims.push(m.line.animate(lays.map(function (l) {
          return { transform: 'translate(' + (Math.round(l.bounds[k]) + 0.5) + 'px, 0px)' };
        }), timing));
      }
      const show = crossShow(first.codes[k].show, lay.codes[k].show);
      zoomAnims.push(m.text.animate(lays.map(function (l, n) {
        return { transform: 'translate(' + l.codes[k].x.toFixed(1) + 'px, 0px)', opacity: show(n / N) };
      }), timing));
    });
    const peakShow = crossShow(first.peak.show, lay.peak.show);
    zoomAnims.push(peakG.animate(lays.map(function (l, n) {
      return { transform: 'translate(' + l.peak.x.toFixed(1) + 'px, ' + l.peak.y.toFixed(1) + 'px)', opacity: peakShow(n / N) };
    }), timing));
    const ckm = points[current][4];
    const cele = points[current][2];
    cursorZoom = cursorGroup.animate(doms.map(function (d) {
      return { transform: 'translate(' + xAt(ckm, d).toFixed(1) + 'px, 0px)' };
    }), timing);
    cursorDotZoom = cursorDot.animate(ydoms.map(function (yd) {
      return { transform: 'translate(0px, ' + yAt(cele, yd).toFixed(1) + 'px)' };
    }), timing);
    main.finished.then(function () {
      if (zoomAnims[0] !== main) return;
      zoomAnims = [];
      cursorZoom = null;
      cursorDotZoom = null;
      leavingTicks.forEach(function (g) { if (g.parentNode) g.parentNode.removeChild(g); });
      leavingTicks = [];
      motion('zoom', false);
    }, function () {});
  }

  function render() {
    // The chart's own width, not the dock's: the dock has side padding.
    const W = Math.round(chart.getBoundingClientRect().width);
    const H = Math.round(chart.getBoundingClientRect().height);
    if (W < 80 || H < 40) return;
    if (W === drawnW && H === drawnH && chart.firstChild) return;
    drawnW = W;
    drawnH = H;
    // The hit rect under the pointer is about to go, and with it the
    // pointerleave that would end the scrub.
    motion('scrub', false);
    hideHover();
    motion('cursor', false);
    stopZoom();
    while (chart.firstChild) chart.removeChild(chart.firstChild);
    chart.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

    const plotH = H - PAD.top - PAD.bottom;
    yBase = yDomain(plotH);
    const yTicks = [];
    for (let v = yBase.lo; v <= yBase.hi; v += yBase.step) {
      yTicks.push({ v: v, text: fmtInt(v) + (v === yBase.hi ? ' m' : '') });
    }
    // The left margin grows past 36px only when the labels need it, which
    // the unit on the top label can force with a wide system font.
    let left = PAD.left;
    const probe = svgEl('text', { x: 0, y: 0 });
    chart.appendChild(probe);
    yTicks.forEach(function (t) {
      probe.textContent = t.text;
      left = Math.max(left, Math.ceil(probe.getComputedTextLength()) + 8);
    });
    chart.removeChild(probe);

    // The data runs between the two ends of the slider thumb's travel, half
    // a thumb in from each end of the slider, so the cursor and the thumb
    // sit on one line. The grid still runs to the dock's gutter.
    const cr = chart.getBoundingClientRect();
    const sr = slider.getBoundingClientRect();
    const thumbHalf = THUMB_PX / 2;
    if (sr.width > THUMB_PX) left = Math.max(left, Math.round(sr.left - cr.left + thumbHalf));
    const plotRight = sr.width > THUMB_PX ? Math.round(sr.right - cr.left - thumbHalf) : W;
    const plotW = plotRight - left;
    const x = function (km) { return left + plotW * (km - xDom.a) / xDom.w; };
    // The paths are drawn on the whole trip's elevation range; a zoom to
    // a day scales them to its own range by transform.
    const y = function (m) { return PAD.top + plotH * (yBase.hi - m) / (yBase.hi - yBase.lo); };
    const bottom = Math.round(PAD.top + plotH) + 0.5;
    scale = { x: x, left: left, plotW: plotW, plotH: plotH, W: W, H: H, bottom: bottom };
    yDom = yDomainFor(xDom);

    yG = drawYGrid(yDom, chart, null);
    tickG = drawTicks(xDom, chart, null);

    // The area under the line is a flat wash of the day's colour so the
    // profile has some body. A plain fill, not a gradient mask: a mask is
    // composited again on every cursor move, and the cursor moves at 60 Hz.
    const floorY = (PAD.top + plotH).toFixed(1);

    // Zoomed to a day the lines run on past the plot, so they are clipped
    // where the grid starts; the cursor's clip leaves room for its dot at
    // either end of the whole trip.
    const defs = svgEl('defs', {});
    const clipPlot = svgEl('clipPath', { id: 'chart-clip' });
    // Its top and bottom are the plot's, so a day whose axis starts above
    // sea level has its area end at the floor and not run on below it.
    clipPlot.appendChild(svgEl('rect', { x: left - 1, y: PAD.top - 2, width: W - left + 1, height: plotH + 2.5 }));
    const clipCursor = svgEl('clipPath', { id: 'cursor-clip' });
    clipCursor.appendChild(svgEl('rect', { x: left - 8, y: 0, width: W - left + 16, height: H }));
    defs.appendChild(clipPlot);
    defs.appendChild(clipCursor);
    chart.appendChild(defs);

    // One subpath per segment, so the chart breaks at the same gaps the
    // map does, and one area and one line path per day. Along x the paths
    // are in km with two decimals, so a short day zoomed to the full width
    // stays smooth; the strokes keep their 2px through the stretch.
    const plotG = svgEl('g', { 'clip-path': 'url(#chart-clip)' });
    const days = svgEl('g', {});
    zoomG = svgEl('g', { class: 'zoom' });
    dayGroups = TRIP.days.map(function (day) {
      const g = svgEl('g', { class: 'day' });
      let line = '';
      let area = '';
      day.segments.forEach(function (seg) {
        if (seg[1] <= seg[0]) return;
        let d = '';
        for (let i = seg[0]; i <= seg[1]; i++) {
          d += (i === seg[0] ? 'M' : 'L') + points[i][4].toFixed(2) + ' ' + y(points[i][2]).toFixed(1);
        }
        line += d;
        area += d + 'L' + points[seg[1]][4].toFixed(2) + ' ' + floorY + 'L' + points[seg[0]][4].toFixed(2) + ' ' + floorY + 'Z';
      });
      if (line) {
        g.appendChild(svgEl('path', { d: area, fill: day.color, 'fill-opacity': 0.14, stroke: 'none' }));
        g.appendChild(svgEl('path', {
          d: line, fill: 'none', stroke: day.color, 'stroke-width': 2,
          'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'vector-effect': 'non-scaling-stroke'
        }));
      }
      zoomG.appendChild(g);
      return g;
    });
    zoomG.style.transform = zoomTransform(xDom, yDom);
    plotG.appendChild(days);

    // Where each province begins, a hairline from the top of the plot to
    // the floor halfway between the last fix in one and the first in the
    // next, and its code at the top left of its band. Under the lines, and
    // in their group so they draw in with them on load.
    provG = svgEl('g', { class: 'prov' });
    days.appendChild(provG);
    days.appendChild(zoomG);
    chart.appendChild(plotG);
    provMarks = visits.map(function (v, k) {
      const mid = function (j) { return (points[visits[j - 1].to_idx][4] + points[visits[j].from_idx][4]) / 2; };
      const m = { a: k ? mid(k) : 0, b: k < visits.length - 1 ? mid(k + 1) : totals.km, line: null };
      if (k) {
        m.line = svgEl('line', { x1: 0, x2: 0, y1: PAD.top, y2: bottom });
        provG.appendChild(m.line);
      }
      m.text = svgEl('text', { x: 0, y: PAD.top + CODE_Y });
      m.text.textContent = v.code;
      provG.appendChild(m.text);
      m.w = m.text.getComputedTextLength();
      return m;
    });
    // The trip's high point, the one extreme worth naming on the profile.
    peakG = svgEl('g', { class: 'peak' });
    peakG.appendChild(svgEl('circle', { cx: 0, cy: 0, r: 2.5 }));
    peakText = svgEl('text', { x: 6, y: 0, dy: '0.35em' });
    peakText.textContent = fmtInt(totals.high_m) + ' m';
    peakG.appendChild(peakText);
    chart.appendChild(peakG);
    peakW = peakText.getComputedTextLength();
    applyMarks(layoutMarks(xDom, yDom));

    const cursorClip = svgEl('g', { 'clip-path': 'url(#cursor-clip)' });
    cursorGroup = svgEl('g', { class: 'cursor' });
    cursorX = null;
    cursorY = null;
    ['transitionend', 'transitioncancel'].forEach(function (type) {
      cursorGroup.addEventListener(type, function () { motion('cursor', false); });
    });
    cursorDot = svgEl('circle', { r: 5, cx: 0, cy: 0 });
    cursorGroup.appendChild(svgEl('line', { x1: 0, x2: 0, y1: PAD.top, y2: PAD.top + plotH }));
    cursorGroup.appendChild(cursorDot);
    cursorClip.appendChild(cursorGroup);
    chart.appendChild(cursorClip);
    chartIntro(days, cursorGroup, peakG);

    // A transparent rect over the plot takes the pointer so the paths and
    // labels underneath never swallow a move or a tap.
    const hit = svgEl('rect', { x: left, y: PAD.top, width: W - left, height: plotH, fill: 'transparent' });
    hit.addEventListener('pointerdown', function (e) {
      pressed = true;
      if (hit.setPointerCapture) hit.setPointerCapture(e.pointerId);
      setIndex(indexAtClientX(e.clientX), 'chart');
    });
    hit.addEventListener('pointermove', function (e) {
      // Only a press moves the marker, so hovering while it plays leaves
      // it alone; a mouse gets a guide line and a label instead.
      if (pressed) setIndex(indexAtClientX(e.clientX), 'chart');
      else if (e.pointerType === 'mouse') showHover(indexAtClientX(e.clientX));
    });
    hit.addEventListener('pointerup', function () { pressed = false; });
    hit.addEventListener('pointercancel', function () { pressed = false; });
    hit.addEventListener('pointerleave', hideHover);
    // A scrub rewrites the readout and the cursor on every move.
    hit.addEventListener('pointerenter', function () { motion('scrub', true); });
    hit.addEventListener('pointerleave', function () { motion('scrub', false); });
    hoverGroup = svgEl('g', { class: 'hover-guide' });
    hoverGroup.appendChild(svgEl('line', { x1: 0, x2: 0, y1: PAD.top, y2: PAD.top + plotH }));
    hoverDot = svgEl('circle', { r: 3.5, cx: 0, cy: 0 });
    hoverGroup.appendChild(hoverDot);
    hoverBox = svgEl('rect', { rx: 6, ry: 6, height: 20, y: PAD.top });
    hoverText = svgEl('text', { y: PAD.top + 14 });
    hoverGroup.appendChild(hoverBox);
    hoverGroup.appendChild(hoverText);
    chart.appendChild(hoverGroup);
    chart.appendChild(hit);

    fadeChart();
    moveCursor(current);
  }

  // The dock changes width on rotation and when the desktop panel resizes
  // the map; one frame coalesces the bursts a resize produces.
  let renderFrame = 0;
  function scheduleRender() {
    if (renderFrame) return;
    renderFrame = requestAnimationFrame(function () { renderFrame = 0; render(); });
  }
  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(scheduleRender).observe(dock);
  } else {
    window.addEventListener('resize', scheduleRender);
  }

  // Load. The days draw themselves in order, each over a share of the
  // time that matches its distance, so a long day takes longer to draw
  // than a short one, and each eases in and out over its own share. The
  // nights pop in as the line reaches them, End and the marker come last,
  // then the chart draws. A pointerdown, wheel, keydown or zoomstart
  // finishes the route and the chart at once; the panel's entrance is
  // short and plays on.
  const REVEAL_MS = 2600;
  const CHART_MS = 800;
  const POP_MS = 220;
  const POP_EASE = 'cubic-bezier(0.34, 1.4, 0.64, 1)';
  let introStart = null;
  let introAnims = [];
  // The time, as a share of one ease-in-out run, at which it reaches a
  // given share of the distance; found by bisection on the
  // cubic-bezier(0.42, 0, 0.58, 1) that 'ease-in-out' stands for.
  function revealTimeAt(share) {
    const bez = function (t, a, b) { const u = 1 - t; return 3 * u * u * t * a + 3 * u * t * t * b + t * t * t; };
    let lo = 0;
    let hi = 1;
    for (let k = 0; k < 24; k++) {
      const mid = (lo + hi) / 2;
      if (bez(mid, 0, 1) < share) lo = mid; else hi = mid;
    }
    return bez((lo + hi) / 2, 0.42, 0.58);
  }
  // A segment's slice of the reveal: from the share of the trip done when
  // it starts to the share done when it ends.
  function revealSpan(seg) {
    const a = Math.min(1, points[seg[0]][4] / totals.km);
    return [a, Math.min(1, Math.max(a, points[seg[1]][4] / totals.km))];
  }
  // When the pen reaches fix i, as a share of the reveal, on its
  // segment's own ease.
  function revealAt(i) {
    for (let d = 0; d < TRIP.days.length; d++) {
      const segs = TRIP.days[d].segments;
      for (let s = 0; s < segs.length; s++) {
        const seg = segs[s];
        if (i < seg[0] || i > seg[1]) continue;
        const span = revealSpan(seg);
        const len = points[seg[1]][4] - points[seg[0]][4];
        const share = len > 0 ? (points[i][4] - points[seg[0]][4]) / len : 1;
        return span[0] + (span[1] - span[0]) * revealTimeAt(share);
      }
    }
    return Math.min(1, points[i][4] / totals.km);
  }
  function pop(node, delay, ms) {
    return node.animate([
      { opacity: 0, transform: 'scale(0.4)' },
      { opacity: 1, transform: 'scale(1)' }
    ], { duration: ms || POP_MS, delay: delay, easing: POP_EASE, fill: 'backwards' });
  }
  function fadeIn(node, delay, ms) {
    return node.animate([{ opacity: 0 }, { opacity: node.style.opacity || 1 }],
      { duration: ms, delay: delay, easing: EASE_UI, fill: 'backwards' });
  }
  function startReveal() {
    if (!canAnimate) return;
    motion('intro', true);
    introStart = document.timeline ? document.timeline.currentTime : null;
    routeParts.forEach(function (part) {
      const path = part.layer.getElement();
      if (!path) return;
      const span = revealSpan(part.seg);
      const a = span[0];
      const b = span[1];
      // A lone fix, or a short day Leaflet has simplified to one pixel at
      // this zoom: a dash has no length to hide there and the round cap
      // would show as a dot, so it appears when the pen reaches it.
      if (part.dot || path.getTotalLength() < 0.5) {
        introAnims.push(path.animate([
          { opacity: 0, offset: 0 }, { opacity: 0, offset: a },
          { opacity: 1, offset: Math.min(1, a + 0.01) }, { opacity: 1, offset: 1 }
        ], { duration: REVEAL_MS, fill: 'both' }));
        return;
      }
      // A dash as long as the path and a gap twice that, pushed just past
      // the start so not even a round cap shows, then pulled back in.
      // pathLength makes that the same numbers for every path.
      part.dashed = true;
      path.setAttribute('pathLength', '1');
      path.style.strokeDasharray = '1 2';
      // The easing on a keyframe runs to the next one, so it eases this
      // segment's slice only and leaves the times linear in distance.
      introAnims.push(path.animate([
        { strokeDashoffset: 1.01, offset: 0 }, { strokeDashoffset: 1.01, offset: a, easing: 'ease-in-out' },
        { strokeDashoffset: 0, offset: b }, { strokeDashoffset: 0, offset: 1 }
      ], { duration: REVEAL_MS, fill: 'both' }));
    });
    TRIP.nights.forEach(function (spot, k) {
      const node = nightDots[k].getElement();
      if (node) introAnims.push(pop(node, revealAt(spot.idx) * REVEAL_MS));
    });
    const startDot = startMarker.getElement();
    const endDot = finishMarker.getElement();
    const startTip = startMarker.getTooltip().getElement();
    const endTip = finishMarker.getTooltip().getElement();
    if (startDot) introAnims.push(pop(startDot, 0));
    if (startTip) introAnims.push(fadeIn(startTip, 60, 240));
    if (endDot) introAnims.push(pop(endDot, REVEAL_MS));
    if (endTip) introAnims.push(fadeIn(endTip, REVEAL_MS + 40, 280));
    // The halo waits for the dot, or a pulse would ring an empty spot.
    const dotIn = pop(trackDot, REVEAL_MS + 200, 320);
    introAnims.push(dotIn);
    trackEl.classList.add('waiting');
    dotIn.finished.then(function () {
      trackEl.classList.remove('waiting');
      restHalo();
    }, function () {});
    // A wheel, key or touch means the viewer wants the map now.
    ['pointerdown', 'wheel', 'keydown'].forEach(function (type) {
      window.addEventListener(type, finishReveal, { capture: true, passive: true });
    });
    map.on('zoomstart', finishReveal);
  }
  // Called once the chart has added its part, so the clean up waits for
  // the last thing to finish.
  function watchReveal() {
    if (!introAnims.length) return;
    Promise.all(introAnims.map(function (anim) { return anim.finished; })).then(cleanReveal, cleanReveal);
  }
  function finishReveal() {
    introAnims.forEach(function (anim) { anim.finish(); });
  }
  // Leaflet redraws every path on each zoom and pan; the dash and the
  // normalised length come off once the reveal is over so those redraws
  // run on plain paths.
  function cleanReveal() {
    if (!introAnims.length) return;
    introAnims.forEach(function (anim) { anim.cancel(); });
    introAnims = [];
    routeParts.forEach(function (part) {
      const path = part.layer.getElement();
      if (!path || !part.dashed) return;
      part.dashed = false;
      path.removeAttribute('pathLength');
      path.style.strokeDasharray = '';
    });
    ['pointerdown', 'wheel', 'keydown'].forEach(function (type) {
      window.removeEventListener(type, finishReveal, { capture: true, passive: true });
    });
    map.off('zoomstart', finishReveal);
    motion('intro', false);
  }
  // The chart draws left to right once the route is down. render() runs
  // again whenever the dock changes size, so each new set of day paths
  // picks the animation up at the time it has reached.
  // The cursor is the marker's twin, so it comes in with the marker rather
  // than sit alone in the empty chart; opacity only, since its transform
  // carries its position.
  function chartIntro(node, cursor, peak) {
    if (introStart === null || !introAnims.length) return;
    const anim = node.animate([
      { clipPath: 'inset(-4px calc(100% + 4px) -4px -4px)' },
      { clipPath: 'inset(-4px -4px -4px -4px)' }
    ], { duration: CHART_MS, delay: REVEAL_MS, easing: 'cubic-bezier(0.45, 0, 0.25, 1)', fill: 'backwards' });
    anim.startTime = introStart;
    introAnims.push(anim);
    const cur = cursor.animate([{ opacity: 0 }, { opacity: 1 }],
      { duration: 320, delay: REVEAL_MS + 200, easing: EASE_UI, fill: 'backwards' });
    cur.startTime = introStart;
    introAnims.push(cur);
    // The high point's label once the line has drawn past it.
    const pk = peak.animate([{ opacity: 0 }, { opacity: peak.style.opacity || 1 }],
      { duration: 240, delay: REVEAL_MS + 300, easing: EASE_UI, fill: 'backwards' });
    pk.startTime = introStart;
    introAnims.push(pk);
  }

  // The panel's sections rise into place one after another and the totals
  // count up. On a phone the stats are in the closed sheet, so this waits
  // for the first time the sheet opens.
  const STAGGER_MS = 40;
  const COUNT_MS = 1100;
  let panelShown = false;
  function panelIntro() {
    if (panelShown) return;
    panelShown = true;
    if (!canAnimate) return;
    motion('panel', true);
    const phone = getComputedStyle(handle).display !== 'none';
    const daysTable = document.getElementById('days');
    const parts = (phone ? [] : [titleEl]).concat(
      Array.prototype.slice.call(totalsEl.children),
      [document.getElementById('records'), document.getElementById('days-head'), daysTable, document.getElementById('provinces')]
    );
    parts.forEach(function (node, k) {
      node.animate([
        { opacity: 0, transform: 'translateY(8px)' },
        { opacity: 1, transform: 'none' }
      ], { duration: 420, delay: k * STAGGER_MS, easing: EASE_UI, fill: 'backwards' });
    });
    // The distance bars grow out from their figures once the table has
    // risen, a row at a time, the way the route draws itself on the map.
    const barsAt = parts.indexOf(daysTable) * STAGGER_MS + 200;
    trs.forEach(function (tr, r) {
      const bar = kmBars[Number(tr.getAttribute('data-day'))];
      bar.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }],
        { duration: 560, delay: barsAt + r * 16, easing: EASE_UI, fill: 'backwards' });
    });
    countUp(counters, COUNT_MS, function () { totalsEl.classList.add('counting'); }, function () {
      totalsEl.classList.remove('counting');
      motion('panel', false);
    });
  }
  function countUp(list, ms, start, done) {
    // Each number is held at its final width first, so the count runs in
    // place, right aligned against the unit.
    list.forEach(function (c) { c.width = c.node.getBoundingClientRect().width; });
    if (start) start();
    list.forEach(function (c) {
      c.node.style.minWidth = c.width + 'px';
      c.node.textContent = c.fmt(0);
    });
    let t0 = null;
    function frame(t) {
      if (t0 === null) t0 = t;
      const k = Math.min(1, (t - t0) / ms);
      const e = 1 - Math.pow(1 - k, 3);
      list.forEach(function (c) {
        const text = k < 1 ? c.fmt(c.to * e) : c.text;
        if (c.node.textContent !== text) c.node.textContent = text;
      });
      if (k < 1) {
        requestAnimationFrame(frame);
        return;
      }
      list.forEach(function (c) { c.node.style.minWidth = ''; });
      if (done) done();
    }
    requestAnimationFrame(frame);
  }

  startReveal();
  render();
  watchReveal();
  setIndex(0, 'init');
  restHalo();
  // Desktop and tablet show the stats from the start. On a phone only the
  // title pill is in view, and it settles in on its own.
  if (getComputedStyle(handle).display === 'none') {
    panelIntro();
  } else if (canAnimate) {
    // The handle's distance runs up while the route draws itself.
    countUp([{ node: handleN, text: handleN.textContent, to: totals.km, fmt: fmt1 }], REVEAL_MS);
    titleEl.animate([
      { opacity: 0, transform: 'translateY(-6px)' },
      { opacity: 1, transform: 'none' }
    ], { duration: 420, easing: EASE_UI, fill: 'backwards' });
  }
})();
</script>
</body>
</html>
